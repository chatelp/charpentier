<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charpentier · maquettes</title>
    <!--
      Mockups only: fonts come from Google Fonts for convenience. The real app embeds
      the chosen OFL fonts (offline-first); nothing is fetched from the network.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap"
    />
    <style>
      /* ───────────── Mockup chrome (not part of the design) ───────────── */
      :root {
        --mk-h: 44px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #111;
      }
      .mk {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--mk-h);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 12px;
        overflow-x: auto;
        background: #16181b;
        color: #c9ccd1;
        font:
          12px/1 system-ui,
          sans-serif;
        white-space: nowrap;
        z-index: 100;
      }
      .mk b {
        color: #fff;
        font-weight: 600;
      }
      .mk .grp {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .mk .lbl {
        color: #7d828a;
        margin-right: 4px;
      }
      .mk button {
        font: inherit;
        color: inherit;
        background: #24272c;
        border: 0;
        padding: 6px 8px;
        border-radius: 5px;
        cursor: pointer;
      }
      .mk button[aria-pressed='true'] {
        background: #e7e9ec;
        color: #111;
      }
      .mk .info {
        margin-left: auto;
        color: #8d939b;
      }

      /* ───────────── Design tokens, per direction and theme ───────────── */
      .app {
        --measure: 38rem;
        --text-size: 1.1875rem;
        --lh: 1.68;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        --raise:
          var(--d) var(--d) var(--b) var(--sh),
          calc(var(--d) * -1) calc(var(--d) * -1) var(--b) var(--hl);
        --raise-s:
          var(--ds) var(--ds) var(--bs) var(--sh),
          calc(var(--ds) * -1) calc(var(--ds) * -1) var(--bs) var(--hl);
        --inset:
          inset var(--ds) var(--ds) var(--bs) var(--sh),
          inset calc(var(--ds) * -1) calc(var(--ds) * -1) var(--bs) var(--hl);
      }
      /* Perle: cool pearl grey, Literata + Inter, round and soft. */
      .app[data-dir='perle'] {
        --font-text: 'Literata', Georgia, serif;
        --font-ui: 'Inter', system-ui, sans-serif;
        --r-lg: 22px;
        --r-md: 14px;
        --r-sm: 9px;
        --d: 6px;
        --b: 14px;
        --ds: 3px;
        --bs: 7px;
      }
      .app[data-dir='perle'][data-theme='light'] {
        --bg: #e3e7ed;
        --ink: #22262d;
        --ink-2: #474d57;
        --muted: #7a828e;
        --faint: #a6adb8;
        --hl: #ffffff;
        --sh: #b3becc;
        --accent: #1f4f7c;
        --accent-soft: rgba(31, 79, 124, 0.1);
      }
      .app[data-dir='perle'][data-theme='dark'] {
        --bg: #262a31;
        --ink: #dfe3ea;
        --ink-2: #b9c0ca;
        --muted: #8a929e;
        --faint: #5d6470;
        --hl: #323740;
        --sh: #1a1d22;
        --accent: #86aedb;
        --accent-soft: rgba(134, 174, 219, 0.13);
      }
      /* Vélin: warm cream, Newsreader + Source Sans 3, the softest relief. */
      .app[data-dir='velin'] {
        --font-text: 'Newsreader', Georgia, serif;
        --font-ui: 'Source Sans 3', system-ui, sans-serif;
        --text-size: 1.3rem;
        --r-lg: 14px;
        --r-md: 10px;
        --r-sm: 6px;
        --d: 4px;
        --b: 11px;
        --ds: 2px;
        --bs: 5px;
      }
      .app[data-dir='velin'][data-theme='light'] {
        --bg: #efe8dc;
        --ink: #2b251d;
        --ink-2: #51483c;
        --muted: #8c8172;
        --faint: #b5aa98;
        --hl: #fffaf2;
        --sh: #d2c4ae;
        --accent: #1d4970;
        --accent-soft: rgba(29, 73, 112, 0.09);
      }
      .app[data-dir='velin'][data-theme='dark'] {
        --bg: #2b2721;
        --ink: #ebe3d5;
        --ink-2: #c7bdac;
        --muted: #968b7a;
        --faint: #62594d;
        --hl: #37322b;
        --sh: #1e1b16;
        --accent: #8fb2d8;
        --accent-soft: rgba(143, 178, 216, 0.12);
      }
      /* Grès: mineral clay, Source Serif 4 + Public Sans, firm and cut. */
      .app[data-dir='gres'] {
        --font-text: 'Source Serif 4', Georgia, serif;
        --font-ui: 'Public Sans', system-ui, sans-serif;
        --r-lg: 8px;
        --r-md: 6px;
        --r-sm: 4px;
        --d: 5px;
        --b: 9px;
        --ds: 2px;
        --bs: 4px;
      }
      .app[data-dir='gres'][data-theme='light'] {
        --bg: #d8d2c8;
        --ink: #25221e;
        --ink-2: #4a453e;
        --muted: #6f685f;
        --faint: #9b9387;
        --hl: #f2ede5;
        --sh: #ada494;
        --accent: #17446a;
        --accent-soft: rgba(23, 68, 106, 0.1);
      }
      .app[data-dir='gres'][data-theme='dark'] {
        --bg: #2f2c28;
        --ink: #e0d9ce;
        --ink-2: #bdb4a7;
        --muted: #8e867a;
        --faint: #5f5951;
        --hl: #3e3a35;
        --sh: #1f1d1a;
        --accent: #88abcf;
        --accent-soft: rgba(136, 171, 207, 0.12);
      }

      /* ───────────── App frame ───────────── */
      .app {
        position: fixed;
        inset: var(--mk-h) 0 0 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .tb {
        flex: none;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        position: relative;
        color: var(--muted);
        font-size: 12px;
      }
      .tb .lights {
        display: flex;
        gap: 8px;
      }
      .tb .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .tb .lights i:nth-child(2) {
        background: #febc2e;
      }
      .tb .lights i:nth-child(3) {
        background: #28c840;
      }
      .tb .ttl {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        letter-spacing: 0.02em;
      }
      .app[data-frame='x250'] .tb {
        display: none;
      }
      .stage {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      /* ───────────── Writing surface (flat page) ───────────── */
      .write {
        position: absolute;
        inset: 0;
        overflow: auto;
        transition:
          right 0.32s var(--ease),
          opacity 0.3s,
          filter 0.3s;
      }
      .write.with-panel {
        right: 27rem;
      }
      .write.behind {
        opacity: 0.45;
        filter: saturate(0.6);
      }
      .wbody {
        padding: 13vh 0 34vh;
      }
      .whead {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        gap: 0.6em;
        padding: 14px 0 10px;
        background: var(--bg);
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
      .whead::after {
        content: '';
        position: absolute;
        inset: 100% 0 auto 0;
        height: 28px;
        background: linear-gradient(var(--bg), transparent);
        pointer-events: none;
      }
      .whead .cur {
        color: var(--ink-2);
      }
      .whead .var {
        color: var(--faint);
      }
      .whead.crumbs span.c {
        padding: 4px 10px;
        border-radius: var(--r-sm);
        box-shadow: var(--raise-s);
        cursor: pointer;
      }
      .wfoot {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        pointer-events: none;
        z-index: 3;
      }
      .wfoot .r {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .wfoot .cnt {
        color: var(--accent);
        pointer-events: auto;
        cursor: pointer;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr min(var(--measure), calc(100% - 4rem)) 1fr;
      }
      .para {
        grid-column: 2;
        margin: 0;
        font-family: var(--font-text);
        font-size: var(--text-size);
        line-height: var(--lh);
        font-optical-sizing: auto;
        hyphens: auto;
        transition: opacity 0.4s;
      }
      .row + .row .para {
        text-indent: 1.6em;
      }
      .write.focus .para {
        opacity: 0.26;
      }
      .write.focus .para.cur {
        opacity: 1;
      }
      .mg {
        grid-column: 3;
        position: relative;
        font-size: var(--text-size);
        line-height: var(--lh);
      }
      .below {
        display: none;
      }
      /* Narrow window: the margin is too thin, the note unfolds under its paragraph. */
      @media (max-width: 1180px) {
        .mg .note {
          display: none;
        }
        .below {
          display: block;
          grid-column: 2;
          position: relative;
          margin: 10px 0 14px;
        }
        .below .note {
          position: relative;
          left: 0;
          top: 0;
          width: auto;
        }
      }
      .who {
        cursor: pointer;
        border-radius: 2px;
      }
      .who:hover {
        background: var(--accent-soft);
      }
      .caret {
        display: inline-block;
        width: 1.5px;
        height: 1.1em;
        margin-left: 1px;
        background: var(--ink);
        vertical-align: -0.18em;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .anc.on {
        background: var(--accent-soft);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
        border-radius: 2px;
      }
      .anc.lang.on {
        background: none;
        text-decoration-style: wavy;
        text-decoration-thickness: 1px;
      }

      /* Pastilles: one shape per direction, intensity = importance. */
      .pst {
        position: absolute;
        left: 1.5rem;
        top: 0.62em;
        cursor: pointer;
        animation: appear 0.5s var(--ease) both;
      }
      .pst[data-l='1'] {
        opacity: 0.42;
      }
      .pst[data-l='2'] {
        opacity: 0.72;
      }
      .app[data-dir='perle'] .pst {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: var(--raise-s);
        display: grid;
        place-items: center;
      }
      .app[data-dir='perle'] .pst::after {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .app[data-dir='velin'] .pst {
        width: 4px;
        height: 1.1em;
        top: 0.3em;
        border-radius: 3px;
        background: var(--accent);
      }
      .app[data-dir='gres'] .pst {
        width: 11px;
        height: 11px;
        transform: rotate(45deg);
        border-radius: 2px;
        box-shadow: var(--raise-s);
        display: grid;
        place-items: center;
      }
      .app[data-dir='gres'] .pst::after {
        content: '';
        width: 5px;
        height: 5px;
        background: var(--accent);
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateX(-6px) scale(0.6);
        }
      }
      .app[data-dir='gres'] .pst {
        animation-name: appear-d;
      }
      @keyframes appear-d {
        from {
          opacity: 0;
          transform: rotate(45deg) scale(0.4);
        }
      }

      /* Margin note: unfolds next to its pastille, never over the text. */
      .note {
        position: absolute;
        left: 2.9rem;
        top: -0.35rem;
        width: min(18.5rem, calc(100% - 3.6rem));
        padding: 12px 14px 12px;
        border-radius: var(--r-md);
        background: var(--bg);
        box-shadow: var(--raise);
        color: var(--ink-2);
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.45;
        z-index: 2;
        animation: unfold 0.28s var(--ease) both;
        transform-origin: left top;
      }
      @keyframes unfold {
        from {
          opacity: 0;
          transform: translateX(-8px) scale(0.97);
        }
      }
      .nk {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .nk span:last-child {
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: none;
        font-size: 11px;
      }
      .nt {
        margin: 0 0 4px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
      }
      .nb {
        margin: 0;
      }
      .nw {
        margin: 9px 0 0;
        padding-top: 8px;
        border-top: 1px solid color-mix(in srgb, var(--sh) 60%, transparent);
        color: var(--muted);
        font-style: italic;
      }
      .na {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 11px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--bg);
        box-shadow: var(--raise-s);
        color: var(--ink);
        font: 500 12.5px/1.2 var(--font-ui);
        cursor: pointer;
        transition: box-shadow 0.18s var(--ease);
      }
      .btn:active,
      .btn.on {
        box-shadow: var(--inset);
      }
      .btn.pri {
        color: var(--accent);
      }
      kbd {
        color: var(--faint);
        font: 500 10.5px/1 var(--font-ui);
      }

      /* ───────────── Raised tools: panel, drawer, sheet ───────────── */
      .panel {
        position: absolute;
        top: 10px;
        right: 12px;
        bottom: 12px;
        width: 25.5rem;
        display: flex;
        flex-direction: column;
        border-radius: var(--r-lg);
        background: var(--bg);
        box-shadow: var(--raise);
        animation: slide-l 0.32s var(--ease) both;
        z-index: 5;
      }
      .panel.left {
        right: auto;
        left: 12px;
        width: 22rem;
        animation-name: slide-r;
      }
      @keyframes slide-l {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
      }
      @keyframes slide-r {
        from {
          opacity: 0;
          transform: translateX(-24px);
        }
      }
      .seg {
        display: flex;
        margin: 14px 14px 6px;
        padding: 4px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
      }
      .seg button {
        flex: 1;
        padding: 8px 0;
        border: 0;
        border-radius: calc(var(--r-md) - 3px);
        background: transparent;
        color: var(--muted);
        font: 500 13px var(--font-ui);
        cursor: pointer;
        transition:
          box-shadow 0.2s,
          color 0.2s;
      }
      .seg button.on {
        box-shadow: var(--raise-s);
        color: var(--ink);
      }
      .seg button .n {
        color: var(--accent);
        margin-left: 4px;
      }
      .pscroll {
        flex: 1;
        overflow: auto;
        padding: 6px 0 10px;
      }
      .gh {
        margin: 14px 18px 8px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .pt {
        position: relative;
        margin: 0 14px 10px;
        padding: 10px 12px 10px 34px;
        border-radius: var(--r-md);
        box-shadow: var(--raise-s);
        font-size: 13px;
        line-height: 1.42;
        color: var(--ink-2);
        cursor: pointer;
        transition: box-shadow 0.2s;
      }
      .pt.sel {
        box-shadow: var(--inset);
      }
      .pt .pst {
        left: 13px;
        top: 13px;
        animation: none;
      }
      .app[data-dir='velin'] .pt .pst {
        top: 11px;
        height: 15px;
      }
      .pt .k {
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pt .k em {
        color: var(--muted);
        font-style: normal;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-transform: none;
      }
      .pt .t {
        color: var(--ink);
        font-weight: 500;
      }
      .pt .na {
        margin-top: 8px;
      }
      .pfoot {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        padding: 10px 18px 14px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .pfoot kbd {
        margin-right: 3px;
      }

      /* Conversation */
      .msg {
        margin: 4px 18px 16px;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .msg .who2 {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .msg.c .who2 {
        color: var(--accent);
      }
      .msg.a {
        color: var(--ink);
      }
      .ex {
        margin: 10px 0 4px;
        padding: 10px 12px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
      }
      .ex .lab {
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ex q {
        display: block;
        margin: 5px 0 9px;
        color: var(--ink);
        font-family: var(--font-text);
        font-size: 15.5px;
        quotes: none;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 14px 4px;
        padding: 12px 14px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
        color: var(--faint);
        font-size: 13.5px;
      }
      .field .grow {
        flex: 1;
      }

      /* ───────────── Command line (bottom) ───────────── */
      .cmdbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 20px 16px;
        background: var(--bg);
        z-index: 6;
        animation: rise 0.26s var(--ease) both;
      }
      .cmdbar::before {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 18px;
        transform: translateY(-100%);
        background: linear-gradient(to top, var(--bg), transparent);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      .cmdres {
        position: absolute;
        left: 20px;
        bottom: calc(100% + 4px);
        width: min(46rem, calc(100% - 40px));
        max-height: 60vh;
        overflow: auto;
        padding: 8px;
        border-radius: var(--r-lg);
        background: var(--bg);
        box-shadow: var(--raise);
      }
      .cmdres.split {
        width: min(62rem, calc(100% - 40px));
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .cmdin {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 16px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
        font-size: 15px;
      }
      .cmdin .pr {
        color: var(--accent);
        font-weight: 600;
      }
      .cmdin input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }
      .cmdin .hint {
        color: var(--faint);
        font-size: 12px;
      }
      .rg {
        margin: 8px 10px 4px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .ri {
        display: grid;
        grid-template-columns: 1.4rem 1fr auto;
        align-items: baseline;
        gap: 6px;
        padding: 8px 10px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-size: 14px;
        cursor: pointer;
      }
      .ri .ic {
        color: var(--faint);
        font-weight: 600;
      }
      .ri .d {
        color: var(--muted);
        font-size: 12px;
      }
      .ri.sel {
        box-shadow: var(--inset);
        color: var(--ink);
      }
      .ri mark {
        background: none;
        color: var(--accent);
        font-weight: 600;
      }
      .detail {
        padding: 6px 10px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
        font-size: 13px;
        color: var(--ink-2);
      }

      /* ───────────── Manuscript: list items (drawer) ───────────── */
      .ms {
        flex: 1;
        overflow: auto;
        padding: 4px 0 10px;
      }
      .ms .ch {
        display: flex;
        justify-content: space-between;
        margin: 12px 18px 4px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }
      .ms .ch span:last-child {
        color: var(--faint);
        font-weight: 500;
      }
      .ms .sc {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 2px 12px;
        padding: 7px 10px 7px 14px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-size: 13px;
        cursor: pointer;
      }
      .ms .sc.act {
        box-shadow: var(--inset);
        color: var(--ink);
      }
      .ms .sc .m {
        color: var(--faint);
        font-size: 11.5px;
      }
      .ms .sc .dots {
        color: var(--accent);
      }
      .ms .sub {
        margin: 6px 16px 8px 26px;
        padding-left: 12px;
        border-left: 1px solid color-mix(in srgb, var(--sh) 70%, transparent);
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .ms .sub .h {
        margin: 6px 0 4px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ms .sub .v {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
      }
      .ms .sub .v.on {
        color: var(--accent);
      }
      .ms .sub .v span:last-child {
        color: var(--faint);
      }

      /* Manuscript: overview board (Vélin) */
      .board {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 28px 18px;
        animation: zoom 0.34s var(--ease) both;
      }
      @keyframes zoom {
        from {
          opacity: 0;
          transform: scale(1.03);
        }
      }
      .board h2 {
        margin: 0 0 4px;
        font: 500 26px var(--font-text);
      }
      .board .sub2 {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .cols {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px;
        overflow: auto;
      }
      .col h3 {
        display: flex;
        justify-content: space-between;
        margin: 0 4px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .col h3 span {
        color: var(--faint);
        font-weight: 500;
      }
      .card {
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: var(--r-md);
        box-shadow: var(--raise-s);
        cursor: pointer;
      }
      .card.act {
        box-shadow: var(--inset);
        outline: 1.5px solid var(--accent);
        outline-offset: 3px;
      }
      .card .n {
        color: var(--faint);
        font-size: 11px;
      }
      .card .t {
        margin: 2px 0 8px;
        font: 500 17px/1.25 var(--font-text);
      }
      .card .m {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }
      .card .m .dots {
        color: var(--accent);
        letter-spacing: 2px;
      }
      .strip {
        flex: none;
        display: flex;
        gap: 26px;
        align-items: center;
        margin-top: 10px;
        padding: 12px 18px;
        border-radius: var(--r-lg);
        box-shadow: var(--raise);
        font-size: 13px;
        color: var(--ink-2);
      }
      .strip .h {
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-right: 8px;
      }
      .chip {
        display: inline-block;
        margin: 2px 4px 2px 0;
        padding: 4px 9px;
        border-radius: var(--r-sm);
        box-shadow: var(--raise-s);
        font-size: 12px;
      }
      .chip.on {
        box-shadow: var(--inset);
        color: var(--accent);
      }

      /* ───────────── Atelier (modules) ───────────── */
      .atelier {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 13.5rem 16.5rem minmax(0, 1fr);
        gap: 22px;
        padding: 10px 22px 18px;
        animation: zoom 0.3s var(--ease) both;
      }
      .rail,
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .rail .seg {
        margin: 0 0 12px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-size: 13.5px;
        cursor: pointer;
      }
      .nav.on {
        box-shadow: var(--inset);
        color: var(--ink);
        font-weight: 500;
      }
      .nav .n {
        color: var(--accent);
        font-size: 12px;
      }
      .list .field {
        margin: 0 0 6px;
      }
      .ent {
        padding: 10px 12px;
        border-radius: var(--r-md);
        cursor: pointer;
        font-size: 13.5px;
      }
      .ent .s {
        color: var(--muted);
        font-size: 11.5px;
      }
      .ent.on {
        box-shadow: var(--inset);
      }
      .ent.prop {
        box-shadow: var(--raise-s);
        color: var(--accent);
      }
      .ent.prop .s {
        color: var(--accent);
        opacity: 0.8;
      }
      .fiche {
        overflow: auto;
        padding: 4px 16px 30px 10px;
        container-type: inline-size;
      }
      @container (max-width: 46rem) {
        .fiche .secs {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @container (max-width: 24rem) {
        .fiche .fld {
          grid-template-columns: minmax(0, 1fr);
        }
        .fiche .fld .fm {
          grid-column: 1;
        }
      }
      @media (max-width: 1100px) {
        .atelier {
          grid-template-columns: 12rem minmax(0, 1fr);
        }
        .atelier .list {
          display: none;
        }
      }
      .fiche h1 {
        margin: 0;
        font: 500 30px/1.15 var(--font-text);
      }
      .fiche .lead {
        margin: 4px 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .legend i {
        display: inline-block;
        width: 26px;
        height: 14px;
        margin-right: 6px;
        border-radius: 4px;
        vertical-align: -2px;
      }
      .legend .lp {
        box-shadow: var(--raise-s);
      }
      .legend .lv {
        box-shadow: var(--inset);
      }
      .legend .lr {
        border: 1px dashed var(--faint);
        opacity: 0.7;
      }
      .legend .lc {
        box-shadow: var(--inset);
        position: relative;
      }
      .legend .lc::after {
        content: '!';
        position: absolute;
        right: 3px;
        top: -1px;
        color: var(--accent);
        font-weight: 700;
        font-size: 11px;
        font-style: normal;
      }
      .secs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 30px;
      }
      .sec h2 {
        margin: 14px 0 8px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sec.wide {
        grid-column: 1 / -1;
      }
      .fld {
        display: grid;
        grid-template-columns: 8.5rem 1fr;
        align-items: start;
        gap: 4px 12px;
        margin-bottom: 10px;
      }
      .fld .fl {
        padding-top: 8px;
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .fld .fv {
        position: relative;
        padding: 7px 12px;
        border-radius: var(--r-sm);
        font-family: var(--font-text);
        font-size: 15.5px;
        line-height: 1.45;
        transition:
          box-shadow 0.35s var(--ease),
          color 0.35s,
          opacity 0.35s;
      }
      .fld .fm {
        grid-column: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .fld[data-st='validated'] .fv,
      .fld[data-st='contradicted'] .fv {
        box-shadow: var(--inset);
      }
      .fld[data-st='proposed'] .fv {
        box-shadow: var(--raise-s);
        color: var(--accent);
        font-style: italic;
      }
      .fld[data-st='proposed'] .fm {
        color: var(--accent);
      }
      .fld[data-st='rejected'] .fv {
        opacity: 0.45;
        text-decoration: line-through;
        text-decoration-color: var(--muted);
      }
      .fld[data-st='contradicted'] .fv {
        padding-right: 30px;
      }
      .fld[data-st='contradicted'] .fv::after {
        content: '!';
        position: absolute;
        right: 6px;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        border-radius: 50%;
        box-shadow: var(--raise-s);
        color: var(--accent);
        font: 700 11px var(--font-ui);
        font-style: normal;
      }
      .fld[data-st='contradicted'] .fm {
        color: var(--accent);
      }
      .fld[data-st='empty'] .fv {
        border: 1px dashed color-mix(in srgb, var(--faint) 70%, transparent);
        color: var(--faint);
        font-family: var(--font-ui);
        font-size: 13px;
      }
      .fm .btn {
        padding: 3px 8px;
        font-size: 11.5px;
      }
      .fm a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      /* Quick sheet (volet) over the scene */
      .panel.volet .fiche {
        padding: 18px 18px 20px;
      }
      .panel.volet .fiche h1 {
        font-size: 24px;
      }
      .panel.volet .fld {
        grid-template-columns: 1fr;
        gap: 3px;
      }
      .panel.volet .fld .fl {
        padding-top: 0;
      }
      .panel.volet .fld .fm {
        grid-column: 1;
      }

      /* ───────────── Personality levers (A, B, C) ───────────── */
      /* A · Pierre chaude: the Perle structure on a warm stone neutral. */
      .app[data-dir='perle'][data-warm='true'][data-theme='light'] {
        --bg: #e5e2dc;
        --ink: #262320;
        --ink-2: #4a4540;
        --muted: #7d766d;
        --faint: #aaa398;
        --hl: #ffffff;
        --sh: #c4beb4;
      }
      .app[data-dir='perle'][data-warm='true'][data-theme='dark'] {
        --bg: #2a2825;
        --ink: #e6e1d9;
        --ink-2: #bfb8ad;
        --muted: #8f877c;
        --faint: #5f5953;
        --hl: #36332f;
        --sh: #1b1a18;
      }
      /* B · Deux encres: vermilion for the author, Prussian blue for the Compagnon. */
      .app {
        --author: var(--ink);
      }
      .app[data-ink='true'][data-theme='light'] {
        --author: #b2432a;
      }
      .app[data-ink='true'][data-theme='dark'] {
        --author: #e3876a;
      }
      .app[data-ink='true'] ::selection {
        background: color-mix(in srgb, var(--author) 24%, transparent);
      }
      .app[data-ink='true'] .caret {
        width: 2px;
        background: var(--author);
      }
      .app[data-ink='true'] .whead .cur,
      .app[data-ink='true'] .today,
      .app[data-ink='true'] .seg button.on,
      .app[data-ink='true'] .nav.on,
      .app[data-ink='true'] .ent.on,
      .app[data-ink='true'] .ms .sc.act,
      .app[data-ink='true'] .chip.on,
      .app[data-ink='true'] .ms .sub .v.on,
      .app[data-ink='true'] .tb .ttl {
        color: var(--author);
      }
      .app[data-ink='true'] .ms .sc.act,
      .app[data-ink='true'] .nav.on,
      .app[data-ink='true'] .ent.on {
        box-shadow:
          var(--inset),
          inset 3px 0 0 var(--author);
      }
      .app[data-ink='true'] .card.act {
        outline-color: var(--author);
      }
      .app[data-ink='true'] .fld[data-st='validated'] .fv {
        box-shadow:
          var(--inset),
          inset 2px 0 0 color-mix(in srgb, var(--author) 70%, transparent);
      }
      .app[data-ink='true'] .msg.a .who2 {
        color: var(--author);
      }
      /* C · Signature: editorial typography (small caps, scene opener, serif labels). */
      .opener {
        grid-column: 2;
        margin: 0 0 3.2rem;
        text-align: center;
        font-family: var(--font-text);
        color: var(--ink-2);
      }
      .opener .cn {
        font-size: 2.6rem;
        font-weight: 400;
        line-height: 1;
        color: var(--author);
      }
      .opener .ct {
        margin-top: 0.4rem;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.14em;
        font-size: 1.15rem;
      }
      .opener .orn {
        margin: 0.9rem 0 0.5rem;
        color: var(--faint);
        font-size: 1.1rem;
      }
      .opener .st {
        font-style: italic;
        font-size: 1.25rem;
        color: var(--ink);
      }
      .app[data-sig='true'] .whead,
      .app[data-sig='true'] .tb .ttl {
        font-family: var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.1em;
        font-size: 14.5px;
      }
      .app[data-sig='true'] .whead .cur {
        font-variant-caps: normal;
        font-style: italic;
        letter-spacing: 0.01em;
        font-size: 14px;
      }
      .app[data-sig='true'] .nk,
      .app[data-sig='true'] .gh,
      .app[data-sig='true'] .rg,
      .app[data-sig='true'] .sec h2,
      .app[data-sig='true'] .ms .sub .h,
      .app[data-sig='true'] .strip .h,
      .app[data-sig='true'] .pt .k,
      .app[data-sig='true'] .ex .lab,
      .app[data-sig='true'] .msg .who2 {
        font-family: var(--font-text);
        font-weight: 500;
        text-transform: none;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        font-size: 13.5px;
      }
      .app[data-sig='true'] .nk span:last-child {
        font-variant-caps: normal;
        font-style: italic;
        letter-spacing: 0;
        font-size: 12.5px;
      }
      .app[data-sig='true'] .ms .ch,
      .app[data-sig='true'] .col h3 {
        font-family: var(--font-text);
        font-weight: 500;
        font-size: 15px;
      }
      .app[data-sig='true'] .nt {
        font-family: var(--font-text);
        font-weight: 500;
        font-size: 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        .app *,
        .app *::before,
        .app *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      .app.still *,
      .app.still *::before,
      .app.still *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

      /* ───────────── Discoverability: entry points (« Découverte ») ───────────── */
      .chrome {
        transition:
          opacity 0.5s var(--ease),
          box-shadow 0.2s,
          color 0.2s;
      }
      .app[data-quiet='true'] .chrome {
        opacity: 0;
        pointer-events: none;
      }
      /* macOS menu bar (Mac frame only: the system draws it above the window). */
      .menubar {
        flex: none;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 10px;
        background: color-mix(in srgb, var(--bg) 70%, #fff 30%);
        color: var(--ink);
        font:
          13px/1 -apple-system,
          system-ui,
          sans-serif;
        position: relative;
        z-index: 20;
      }
      .app[data-theme='dark'] .menubar {
        background: color-mix(in srgb, var(--bg) 80%, #000 20%);
      }
      .menubar .mi {
        position: relative;
        padding: 4px 9px;
        border-radius: 5px;
        cursor: default;
      }
      .menubar .mi:first-child {
        font-weight: 700;
      }
      .menubar .mi.on {
        background: color-mix(in srgb, var(--ink) 14%, transparent);
      }
      .mdd {
        position: absolute;
        top: calc(100% + 3px);
        left: 0;
        min-width: 300px;
        padding: 5px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--bg) 88%, #fff 12%);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.22),
          0 0 0 0.5px rgba(0, 0, 0, 0.18);
        font-weight: 400;
      }
      .app[data-theme='dark'] .mdd {
        background: #30353d;
      }
      .mdd div {
        display: flex;
        justify-content: space-between;
        gap: 28px;
        padding: 4px 10px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .mdd div:hover {
        background: var(--accent);
        color: #fff;
      }
      .mdd div span:last-child {
        color: var(--muted);
      }
      .mdd div:hover span:last-child {
        color: #fff;
      }
      .mdd hr {
        border: 0;
        border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
        margin: 5px 10px;
      }
      /* Direction 1: handles on the edges, where the panels come from. */
      .edge {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px 8px 12px;
        border: 0;
        background: var(--bg);
        box-shadow: var(--raise-s);
        color: var(--muted);
        cursor: pointer;
      }
      .edge:hover {
        color: var(--ink);
        box-shadow: var(--raise);
      }
      .edge.l {
        left: 0;
        border-radius: 0 var(--r-md) var(--r-md) 0;
      }
      .edge.r {
        right: 0;
        border-radius: var(--r-md) 0 0 var(--r-md);
      }
      .edge .v {
        writing-mode: vertical-rl;
        font: 500 13.5px var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
      }
      .edge.l .v {
        transform: rotate(180deg);
      }
      .edge .n {
        min-width: 18px;
        padding: 2px 0;
        border-radius: 9px;
        box-shadow: var(--inset);
        color: var(--accent);
        font: 600 11px var(--font-ui);
      }
      .modes {
        position: absolute;
        top: 10px;
        right: 16px;
        z-index: 4;
        display: flex;
        padding: 3px;
        border-radius: var(--r-sm);
        box-shadow: var(--inset);
      }
      .modes button {
        padding: 5px 11px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: 500 12px var(--font-ui);
        cursor: pointer;
      }
      .modes button.on {
        box-shadow: var(--raise-s);
        color: var(--author, var(--ink));
      }
      /* The command zone, always in the footer: the beginner's way into everything. */
      .cmdz {
        position: absolute;
        left: 50%;
        bottom: -5px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(30rem, 38%);
        padding: 7px 12px;
        border: 0;
        border-radius: var(--r-md);
        background: var(--bg);
        box-shadow: var(--inset);
        color: var(--faint);
        font: 13px var(--font-ui);
        text-align: left;
        pointer-events: auto;
        cursor: text;
      }
      .cmdz.inl {
        position: static;
        transform: none;
        width: auto;
        margin-top: auto;
      }
      .list > .btn {
        justify-content: center;
        margin: 2px 0 10px;
      }
      .cmdz:hover {
        color: var(--muted);
      }
      .cmdz .pr {
        color: var(--accent);
        font-size: 15px;
      }
      .cmdz .grow {
        flex: 1;
      }
      .wfoot .tbtn,
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--muted);
        font: 500 12px var(--font-ui);
        pointer-events: auto;
        cursor: pointer;
      }
      .tbtn:hover {
        color: var(--ink);
        box-shadow: var(--raise-s);
      }
      .tbtn.on {
        box-shadow: var(--inset);

        o.type = 'sine';

      const norm = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
      function match(text, q) {
        if (!q) return text;
        const t = norm(text);
        const nq = norm(q);
        let j = 0;
        const hits = [];
        for (let i = 0; i < t.length && j < nq.length; i++) if (t[i] === nq[j]) (hits.push(i), j++);
        if (j < nq.length) return null;
        // Prefer contiguous substring highlighting when available.
        const at = t.indexOf(nq);
        const set = new Set(at >= 0 ? [...nq].map((_, k) => at + k) : hits);
        return [...text].map((ch, i) => (set.has(i) ? `<mark>${ch}</mark>` : ch)).join('');

          q = q.slice(1).trim();
        }
        const out = [];
        for (const [g, ic, t, d] of CMDS) {
          if (prefix && g !== prefix) continue;
          const m = match(t, q);
          if (m) out.push([g, ic, m, d]);

            ? ''
            : `<button class="cmdz inl chrome" data-go="palette" title="Ligne de commande (⌘K)"><span class="pr">›</span><span class="grow">Que voulez-vous faire ?</span><kbd>⌘K</kbd></button>`;
        const add =
          disc === 'actuel'
            ? ''
            : `<button class="btn" title="Nouveau personnage (ligne de commande : « nouveau personnage »)">+ Nouveau personnage</button>`;
        return `<section class="atelier"><div class="rail"><div class="seg"><button data-go="ecrire">Écrire</button><button class="on">Atelier</button></div>${mods}${cmd}<div class="pfoot" style="${cmd ? 'margin-top:10px' : 'margin-top:auto'};padding:0"><span><kbd>⌘E</kbd>écrire / atelier</span><span><kbd>⌘1…5</kbd>modules</span></div></div>
          <div class="list"><div class="field"><span class="grow">Filtrer les personnages…</span><kbd>/</kbd></div>${add}${ents}<div class="pfoot" style="margin-top:auto;padding:0"><span><kbd>V</kbd>valider</span><span><kbd>X</kbd>rejeter</span><span><kbd>⏎</kbd>modifier</span></div></div>${ficheBody(false)}</section>`;
      }

      // ───────────── Render ─────────────
      function renderBar() {
        const b = (k, v, label) =>
          `<button data-k="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${label}</button>`;
        document.getElementById('mk').innerHTML = `
          <b>Charpentier · maquettes</b>
          <span class="grp"><span class="lbl">Direction <kbd>D</kbd></span>${Object.entries(DIRS)
            .map(([k, d]) => b('dir', k, d.name))
            .join('')}</span>
          <span class="grp"><span class="lbl">Découverte <kbd>G</kbd></span>${DISC_KEYS.map((k) => b('disc', k, DISC[k][0])).join('')}${b('quiet', !S.quiet, S.quiet ? 'Frappe : en cours' : 'Frappe : à l’arrêt')}</span>
          <span class="grp"><span class="lbl">Écran <kbd>1–8</kbd></span>${SCREENS.map(([k, l]) => b('screen', k, l)).join('')}</span>
          <span class="grp"><span class="lbl">Thème <kbd>T</kbd></span>${b('theme', 'light', 'Clair')}${b('theme', 'dark', 'Sombre')}</span>
          <span class="grp"><span class="lbl">Cadre</span>${b('frame', 'mac', 'Mac')}${b('frame', 'x250', 'X250')}</span>
          <span class="grp"><span class="lbl">Personnalité <kbd>A B C</kbd></span>${b('warm', !S.warm, 'A · Pierre chaude')}${b('ink', !S.ink, 'B · Deux encres')}${b('sig', !S.sig, 'C · Signature')}</span>
          <span class="grp">${b('focus', !S.focus, S.focus ? 'Focus : oui' : 'Focus : non')}${b('sound', !S.sound, S.sound ? 'Sons : oui' : 'Sons : non')}${b('still', !S.still, S.still ? 'Animations : non' : 'Animations : oui')}</span>
          <span class="info">${S.dir === 'perle' ? DISC[S.disc][1] : DIRS[S.dir].info}</span>`;
        document
          .querySelectorAll(
            '.mk [data-k="focus"], .mk [data-k="sound"], .mk [data-k="still"], .mk [data-k="warm"], .mk [data-k="ink"], .mk [data-k="sig"], .mk [data-k="quiet"]',
          )
          .forEach((el) => el.setAttribute('aria-pressed', S[el.dataset.k]));
      }
      function render() {
        const typing = document.activeElement && document.activeElement.id === 'q';
        const app = document.getElementById('app');
        app.dataset.dir = S.dir;
        app.dataset.theme = S.theme;
        app.dataset.frame = S.frame;
        app.dataset.warm = S.warm;
        app.dataset.ink = S.ink;
        app.dataset.sig = S.sig;
        app.classList.toggle('still', S.still);
        const disc = S.dir === 'perle' ? S.disc : 'actuel';
        app.dataset.disc = disc;
        app.dataset.quiet = S.quiet;
        let body = '';
        const docked =
          disc === 'etabli' && S.screen !== 'fiche' && !(S.screen === 'manuscrit' && S.plan);
        if (docked) {
          const sig = S.screen !== 'ecrire' && S.screen !== 'accueil';
          const empty = S.screen === 'accueil';
          const right = true;
          body =
            scene({ signals: sig, panel: right, left: true, empty }) +
            drawer(true, empty) +
            (S.screen === 'volet'
              ? `<aside class="panel volet">${ficheBody(true)}<div class="pfoot"><span><kbd>⌘⏎</kbd>ouvrir dans l’Atelier</span><span><kbd>Échap</kbd>fermer</span></div></aside>`
              : rightPanel(empty)) +
            (S.screen === 'palette'
              ? cmdbar('›', S.q, `<div class="cmdres">${resultList(results(S.q))}</div>`)
              : '');
        } else
          switch (S.screen) {
            case 'accueil':
              body = scene({ empty: true });
              break;
            case 'ecrire':
              body = scene();
              break;
            case 'mentor':
              body = scene({ signals: true });
              break;
            case 'points':
              body = scene({ signals: true, panel: true }) + rightPanel();
              break;
            case 'volet':
              body =
                scene({ signals: true, panel: true }) +
                `<aside class="panel volet">${ficheBody(true)}<div class="pfoot"><span><kbd>⌘⏎</kbd>ouvrir dans l’Atelier</span><span><kbd>Échap</kbd>fermer</span></div></aside>`;
              break;
            case 'palette':
              body =
                scene({ signals: true }) +
                cmdbar('›', S.q, `<div class="cmdres">${resultList(results(S.q))}</div>`);
              break;
            case 'fiche':
              body = atelier();
              break;
            case 'manuscrit':
              if (S.dir === 'perle') body = S.plan ? board() : scene({ behind: true }) + drawer();
              else if (S.dir === 'velin') body = board();
              else body = scene({ behind: true, crumbs: true }) + gresNav();
              break;
          }
        if (disc === 'rails' && S.screen !== 'fiche') body += edges(S.screen);
        if (disc === 'barre' && S.aa) body += aaPop(true);
        const tb = disc === 'barre' ? toolbar() : `<span class="ttl">Les Serres d’Hespéride</span>`;
        app.innerHTML = `${menubar()}<div class="tb"><span class="lights"><i></i><i></i><i></i></span>${tb}</div><div class="stage">${body}</div>`;
        placeTip(app);
        renderBar();
        history.replaceState(null, '', `#${S.dir}/${S.theme}/${S.screen}/${S.disc}`);
        // Typewriter scrolling: the current paragraph sits a little above the middle.
        const w = app.querySelector('.write');
        const cur = w && w.querySelector('.para.cur');
        if (cur && !(S.sig && S.screen === 'ecrire'))
          w.scrollTop = cur.offsetTop - w.clientHeight * 0.42;
        const q = document.getElementById('q');
        if (q && typing) {
          q.focus();
          q.setSelectionRange(q.value.length, q.value.length);
        }
      }

      // ───────────── Interactions ─────────────
      document.addEventListener('click', (e) => {
        const mi = e.target.closest('[data-menu]');
        if (mi && !e.target.closest('.mdd')) {
          S.menu = S.menu === +mi.dataset.menu ? null : +mi.dataset.menu;
          return render();
        }
        if (S.menu !== null) {
          S.menu = null;
          render();
        }
        const aa = e.target.closest('[data-aa]');
        if (aa) {
          S.aa = !S.aa;
          return render();
        }
        if (e.target.closest('[data-tour-next] .btn')) {
          S.tour = S.tour < 3 ? S.tour + 1 : 0;
          return render();
        }
        const act0 = e.target.closest('.btn[data-act]');
        if (act0 && act0.dataset.act === 'Faire le tour') {
          S.tour = 1;
          return render();
        }
        const k = e.target.closest('[data-k]');
        if (k) {
          const v = k.dataset.v;
          S[k.dataset.k] = v === 'true' ? true : v === 'false' ? false : v;
          if (k.dataset.k === 'screen' || k.dataset.k === 'disc') {
            S.tour = 0;
            S.aa = false;
            S.sel = 0;
            S.plan = false;
            S.q = v === 'manuscrit' ? 'bur' : 'va';
          }
          return render();
        }
        const p = e.target.closest('[data-open]');
        if (p) {
          S.open = S.open === p.dataset.open ? null : p.dataset.open;
          tock(620);
          return render();
        }
        const plan = e.target.closest('[data-plan]');
        if (plan) {
          S.plan = plan.dataset.plan === '1';
          return render();
        }
        const tab = e.target.closest('[data-tab]');
        if (tab) {
          S.tab = tab.dataset.tab;
          tock(480);
          return render();
        }
        const go = e.target.closest('[data-go]');
        if (go) {
          S.screen = go.dataset.go;
          S.tour = 0;
          S.aa = false;
          S.plan = false;
          return render();
        }
        if (e.target.closest('.who')) {
          S.screen = 'volet';
          return render();
        }
        const act = e.target.closest('.fld .btn');
        if (act) {
          const fld = act.closest('.fld');
          const ok = act.dataset.act === 'Valider';
          fld.dataset.st = ok ? 'validated' : 'rejected';
          fld.querySelector('.fm').innerHTML =
            `<span>${ok ? 'Validée à l’instant' : 'Rejetée à l’instant'}</span>`;
          return tock(ok ? 660 : 380);
        }
        if (e.target.closest('.btn')) tock();
        const ri = e.target.closest('.ri[data-i]');
        if (ri) {
          S.sel = +ri.dataset.i;
          render();
        }
      });
      document.addEventListener('input', (e) => {
        if (e.target.id !== 'q') return;
        S.q = S.screen === 'manuscrit' ? '#' + e.target.value : e.target.value;
        S.sel = 0;
        render();
      });
      document.addEventListener('keydown', (e) => {
        const inInput = e.target.id === 'q';
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          if (document.querySelector('.cmdres')) {
            e.preventDefault();
            const n = document.querySelectorAll('.cmdres .ri[data-i]').length;
            S.sel = (S.sel + (e.key === 'ArrowDown' ? 1 : n - 1)) % Math.max(n, 1);
            render();
          }
          return;
        }
        if (inInput) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === 'Escape') {
          S.menu = null;
          S.aa = false;
          S.tour = 0;
          e.preventDefault();
          return render();
        }
        const i = '12345678'.indexOf(e.key);
        if (i >= 0) {
          S.screen = SCREENS[i][0];
          S.sel = 0;
          S.q = S.screen === 'manuscrit' ? 'bur' : 'va';
        } else if (e.key === 'd') {
          const ks = Object.keys(DIRS);
          S.dir = ks[(ks.indexOf(S.dir) + 1) % ks.length];
        } else if (e.key === 'g') {
          S.disc = DISC_KEYS[(DISC_KEYS.indexOf(S.disc) + 1) % DISC_KEYS.length];
          S.tour = 0;
        } else if (e.key === 'w') S.quiet = !S.quiet;
        else if (e.key === 't') S.theme = S.theme === 'light' ? 'dark' : 'light';
        else if (e.key === 'a') S.warm = !S.warm;
        else if (e.key === 'b') S.ink = !S.ink;
        else if (e.key === 'c') S.sig = !S.sig;
        else if (e.key === 'f') S.focus = !S.focus;
        else return;
        e.preventDefault();
        render();
      });
      render();
    </script>
  </body>
</html>
