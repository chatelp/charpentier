<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charpentier · maquettes</title>
    <!--
      Mockups only: fonts come from Google Fonts for convenience. The real app embeds
      the chosen OFL fonts (offline-first); nothing is fetched from the network.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      /* ───────────── Mockup chrome (not part of the design) ───────────── */
      :root {
        --mk-h: 44px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #111;
      }
      .mk {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--mk-h);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 12px;
        overflow-x: auto;
        background: #16181b;
        color: #c9ccd1;
        font:
          12px/1 system-ui,
          sans-serif;
        white-space: nowrap;
        z-index: 100;
      }
      .mk b {
        color: #fff;
        font-weight: 600;
      }
      .mk .grp {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .mk .lbl {
        color: #7d828a;
        margin-right: 4px;
      }
      .mk button {
        font: inherit;
        color: inherit;
        background: #24272c;
        border: 0;
        padding: 6px 8px;
        border-radius: 5px;
        cursor: pointer;
      }
      .mk button[aria-pressed='true'] {
        background: #e7e9ec;
        color: #111;
      }
      .mk .info {
        margin-left: auto;
        color: #8d939b;
      }

      /* ───────────── Design tokens, per direction and theme ───────────── */
      .app {
        --measure: 38rem;
        --text-size: 1.1875rem;
        --lh: 1.68;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        --raise:
          var(--d) var(--d) var(--b) var(--sh),
          calc(var(--d) * -1) calc(var(--d) * -1) var(--b) var(--hl);
        --raise-s:
          var(--ds) var(--ds) var(--bs) var(--sh),
          calc(var(--ds) * -1) calc(var(--ds) * -1) var(--bs) var(--hl);
        --inset:
          inset var(--ds) var(--ds) var(--bs) var(--sh),
          inset calc(var(--ds) * -1) calc(var(--ds) * -1) var(--bs) var(--hl);
      }
      /* Perle: cool pearl grey, Literata + Inter, round and soft. */
      .app[data-dir='perle'] {
        --font-text: 'Literata', Georgia, serif;
        --font-ui: 'Inter', system-ui, sans-serif;
        --r-lg: 22px;
        --r-md: 14px;
        --r-sm: 9px;
        --d: 6px;
        --b: 14px;
        --ds: 3px;
        --bs: 7px;
      }
      .app[data-dir='perle'][data-theme='light'] {
        --bg: #e3e7ed;
        --ink: #22262d;
        --ink-2: #474d57;
        --muted: #7a828e;
        --faint: #a6adb8;
        --hl: #ffffff;
        --sh: #b3becc;
        --accent: #1f4f7c;
        --accent-soft: rgba(31, 79, 124, 0.1);
      }
      .app[data-dir='perle'][data-theme='dark'] {
        --bg: #262a31;
        --ink: #dfe3ea;
        --ink-2: #b9c0ca;
        --muted: #8a929e;
        --faint: #5d6470;
        --hl: #323740;
        --sh: #1a1d22;
        --accent: #86aedb;
        --accent-soft: rgba(134, 174, 219, 0.13);
      }
      /* Vélin: warm cream, Newsreader + Source Sans 3, the softest relief. */
      .app[data-dir='velin'] {
        --font-text: 'Newsreader', Georgia, serif;
        --font-ui: 'Source Sans 3', system-ui, sans-serif;
        --text-size: 1.3rem;
        --r-lg: 14px;
        --r-md: 10px;
        --r-sm: 6px;
        --d: 4px;
        --b: 11px;
        --ds: 2px;
        --bs: 5px;
      }
      .app[data-dir='velin'][data-theme='light'] {
        --bg: #efe8dc;
        --ink: #2b251d;
        --ink-2: #51483c;
        --muted: #8c8172;
        --faint: #b5aa98;
        --hl: #fffaf2;
        --sh: #d2c4ae;
        --accent: #1d4970;
        --accent-soft: rgba(29, 73, 112, 0.09);
      }
      .app[data-dir='velin'][data-theme='dark'] {
        --bg: #2b2721;
        --ink: #ebe3d5;
        --ink-2: #c7bdac;
        --muted: #968b7a;
        --faint: #62594d;
        --hl: #37322b;
        --sh: #1e1b16;
        --accent: #8fb2d8;
        --accent-soft: rgba(143, 178, 216, 0.12);
      }
      /* Grès: mineral clay, Source Serif 4 + Public Sans, firm and cut. */
      .app[data-dir='gres'] {
        --font-text: 'Source Serif 4', Georgia, serif;
        --font-ui: 'Public Sans', system-ui, sans-serif;
        --r-lg: 8px;
        --r-md: 6px;
        --r-sm: 4px;
        --d: 5px;
        --b: 9px;
        --ds: 2px;
        --bs: 4px;
      }
      .app[data-dir='gres'][data-theme='light'] {
        --bg: #d8d2c8;
        --ink: #25221e;
        --ink-2: #4a453e;
        --muted: #6f685f;
        --faint: #9b9387;
        --hl: #f2ede5;
        --sh: #ada494;
        --accent: #17446a;
        --accent-soft: rgba(23, 68, 106, 0.1);
      }
      .app[data-dir='gres'][data-theme='dark'] {
        --bg: #2f2c28;
        --ink: #e0d9ce;
        --ink-2: #bdb4a7;
        --muted: #8e867a;
        --faint: #5f5951;
        --hl: #3e3a35;
        --sh: #1f1d1a;
        --accent: #88abcf;
        --accent-soft: rgba(136, 171, 207, 0.12);
      }

      /* ───────────── App frame ───────────── */
      .app {
        position: fixed;
        inset: var(--mk-h) 0 0 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .tb {
        flex: none;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        position: relative;
        color: var(--muted);
        font-size: 12px;
      }
      .tb .lights {
        display: flex;
        gap: 8px;
      }
      .tb .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .tb .lights i:nth-child(2) {
        background: #febc2e;
      }
      .tb .lights i:nth-child(3) {
        background: #28c840;
      }
      .tb .ttl {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        letter-spacing: 0.02em;
      }
      .app[data-frame='x250'] .tb {
        display: none;
      }
      .stage {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      /* ───────────── Writing surface (flat page) ───────────── */
      .write {
        position: absolute;
        inset: 0;
        overflow: auto;
        transition:
          right 0.32s var(--ease),
          opacity 0.3s,
          filter 0.3s;
      }
      .write.with-panel {
        right: 27rem;
      }
      .write.behind {
        opacity: 0.45;
        filter: saturate(0.6);
      }
      .wbody {
        padding: 13vh 0 34vh;
      }
      .whead {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        gap: 0.6em;
        padding: 14px 0 10px;
        background: var(--bg);
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
      .whead::after {
        content: '';
        position: absolute;
        inset: 100% 0 auto 0;
        height: 28px;
        background: linear-gradient(var(--bg), transparent);
        pointer-events: none;
      }
      .whead .cur {
        color: var(--ink-2);
      }
      .whead .var {
        color: var(--faint);
      }
      .whead.crumbs span.c {
        padding: 4px 10px;
        border-radius: var(--r-sm);
        box-shadow: var(--raise-s);
        cursor: pointer;
      }
      .wfoot {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        pointer-events: none;
        z-index: 3;
      }
      .wfoot .r {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .wfoot .cnt {
        color: var(--accent);
        pointer-events: auto;
        cursor: pointer;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr min(var(--measure), calc(100% - 4rem)) 1fr;
      }
      .para {
        grid-column: 2;
        margin: 0;
        font-family: var(--font-text);
        font-size: var(--text-size);
        line-height: var(--lh);
        font-optical-sizing: auto;
        hyphens: auto;
        transition: opacity 0.4s;
      }
      .row + .row .para {
        text-indent: 1.6em;
      }
      .write.focus .para {
        opacity: 0.26;
      }
      .write.focus .para.cur {
        opacity: 1;
      }
      .mg {
        grid-column: 3;
        position: relative;
        font-size: var(--text-size);
        line-height: var(--lh);
      }
      .below {
        display: none;
      }
      /* Narrow window: the margin is too thin, the note unfolds under its paragraph. */
      @media (max-width: 1180px) {
        .mg .note {
          display: none;
        }
        .below {
          display: block;
          grid-column: 2;
          position: relative;
          margin: 10px 0 14px;
        }
        .below .note {
          position: relative;
          left: 0;
          top: 0;
          width: auto;
        }
      }
      .who {
        cursor: pointer;
        border-radius: 2px;
      }
      .who:hover {
        background: var(--accent-soft);
      }
      .caret {
        display: inline-block;
        width: 1.5px;
        height: 1.1em;
        margin-left: 1px;
        background: var(--ink);
        vertical-align: -0.18em;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .anc.on {
        background: var(--accent-soft);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
        border-radius: 2px;
      }
      .anc.lang.on {
        background: none;
        text-decoration-style: wavy;
        text-decoration-thickness: 1px;
      }

      /* Pastilles: one shape per direction, intensity = importance. */
      .pst {
        position: absolute;
        left: 1.5rem;
        top: 0.62em;
        cursor: pointer;
        animation: appear 0.5s var(--ease) both;
      }
      .pst[data-l='1'] {
        opacity: 0.42;
      }
      .pst[data-l='2'] {
        opacity: 0.72;
      }
      .app[data-dir='perle'] .pst {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: var(--raise-s);
        display: grid;
        place-items: center;
      }
      .app[data-dir='perle'] .pst::after {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .app[data-dir='velin'] .pst {
        width: 4px;
        height: 1.1em;
        top: 0.3em;
        border-radius: 3px;
        background: var(--accent);
      }
      .app[data-dir='gres'] .pst {
        width: 11px;
        height: 11px;
        transform: rotate(45deg);
        border-radius: 2px;
        box-shadow: var(--raise-s);
        display: grid;
        place-items: center;
      }
      .app[data-dir='gres'] .pst::after {
        content: '';
        width: 5px;
        height: 5px;
        background: var(--accent);
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateX(-6px) scale(0.6);
        }
      }
      .app[data-dir='gres'] .pst {
        animation-name: appear-d;
      }
      @keyframes appear-d {
        from {
          opacity: 0;
          transform: rotate(45deg) scale(0.4);
        }
      }

      /* Margin note: unfolds next to its pastille, never over the text. */
      .note {
        position: absolute;
        left: 2.9rem;
        top: -0.35rem;
        width: min(18.5rem, calc(100% - 3.6rem));
        padding: 12px 14px 12px;
        border-radius: var(--r-md);
        background: var(--bg);
        box-shadow: var(--raise);
        color: var(--ink-2);
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.45;
        z-index: 2;
        animation: unfold 0.28s var(--ease) both;
        transform-origin: left top;
      }
      @keyframes unfold {
        from {
          opacity: 0;
          transform: translateX(-8px) scale(0.97);
        }
      }
      .nk {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .nk span:last-child {
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: none;
        font-size: 11px;
      }
      .nt {
        margin: 0 0 4px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
      }
      .nb {
        margin: 0;
      }
      .nw {
        margin: 9px 0 0;
        padding-top: 8px;
        border-top: 1px solid color-mix(in srgb, var(--sh) 60%, transparent);
        color: var(--muted);
        font-style: italic;
      }
      .na {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 11px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--bg);
        box-shadow: var(--raise-s);
        color: var(--ink);
        font: 500 12.5px/1.2 var(--font-ui);
        cursor: pointer;
        transition: box-shadow 0.18s var(--ease);
      }
      .btn:active,
      .btn.on {
        box-shadow: var(--inset);
      }
      .btn.pri {
        color: var(--accent);
      }
      kbd {
        color: var(--faint);
        font: 500 10.5px/1 var(--font-ui);
      }

      /* ───────────── Raised tools: panel, drawer, sheet ───────────── */
      .panel {
        position: absolute;
        top: 10px;
        right: 12px;
        bottom: 12px;
        width: 25.5rem;
        display: flex;
        flex-direction: column;
        border-radius: var(--r-lg);
        background: var(--bg);
        box-shadow: var(--raise);
        animation: slide-l 0.32s var(--ease) both;
        z-index: 5;
      }
      .panel.left {
        right: auto;
        left: 12px;
        width: 22rem;
        animation-name: slide-r;
      }
      @keyframes slide-l {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
      }
      @keyframes slide-r {
        from {
          opacity: 0;
          transform: translateX(-24px);
        }
      }
      .seg {
        display: flex;
        margin: 14px 14px 6px;
        padding: 4px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
      }
      .seg button {
        flex: 1;
        padding: 8px 0;
        border: 0;
        border-radius: calc(var(--r-md) - 3px);
        background: transparent;
        color: var(--muted);
        font: 500 13px var(--font-ui);
        cursor: pointer;
        transition:
          box-shadow 0.2s,
          color 0.2s;
      }
      .seg button.on {
        box-shadow: var(--raise-s);
        color: var(--ink);
      }
      .seg button .n {
        color: var(--accent);
        margin-left: 4px;
      }
      .pscroll {
        flex: 1;
        overflow: auto;
        padding: 6px 0 10px;
      }
      .gh {
        margin: 14px 18px 8px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .pt {
        position: relative;
        margin: 0 14px 10px;
        padding: 10px 12px 10px 34px;
        border-radius: var(--r-md);
        box-shadow: var(--raise-s);
        font-size: 13px;
        line-height: 1.42;
        color: var(--ink-2);
        cursor: pointer;
        transition: box-shadow 0.2s;
      }
      .pt.sel {
        box-shadow: var(--inset);
      }
      .pt .pst {
        left: 13px;
        top: 13px;
        animation: none;
      }
      .app[data-dir='velin'] .pt .pst {
        top: 11px;
        height: 15px;
      }
      .pt .k {
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pt .k em {
        color: var(--muted);
        font-style: normal;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-transform: none;
      }
      .pt .t {
        color: var(--ink);
        font-weight: 500;
      }
      .pt .na {
        margin-top: 8px;
      }
      .pfoot {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        padding: 10px 18px 14px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .pfoot kbd {
        margin-right: 3px;
      }

      /* Conversation */
      .msg {
        margin: 4px 18px 16px;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .msg .who2 {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .msg.c .who2 {
        color: var(--accent);
      }
      .msg.a {
        color: var(--ink);
      }
      .ex {
        margin: 10px 0 4px;
        padding: 10px 12px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
      }
      .ex .lab {
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ex q {
        display: block;
        margin: 5px 0 9px;
        color: var(--ink);
        font-family: var(--font-text);
        font-size: 15.5px;
        quotes: none;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 14px 4px;
        padding: 12px 14px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
        color: var(--faint);
        font-size: 13.5px;
      }
      .field .grow {
        flex: 1;
      }

      /* ───────────── Command line (bottom) ───────────── */
      .cmdbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 20px 16px;
        background: var(--bg);
        z-index: 6;
        animation: rise 0.26s var(--ease) both;
      }
      .cmdbar::before {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 18px;
        transform: translateY(-100%);
        background: linear-gradient(to top, var(--bg), transparent);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      .cmdres {
        position: absolute;
        left: 20px;
        bottom: calc(100% + 4px);
        width: min(46rem, calc(100% - 40px));
        max-height: 60vh;
        overflow: auto;
        padding: 8px;
        border-radius: var(--r-lg);
        background: var(--bg);
        box-shadow: var(--raise);
      }
      .cmdres.split {
        width: min(62rem, calc(100% - 40px));
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .cmdin {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 16px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
        font-size: 15px;
      }
      .cmdin .pr {
        color: var(--accent);
        font-weight: 600;
      }
      .cmdin input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }
      .cmdin .hint {
        color: var(--faint);
        font-size: 12px;
      }
      .rg {
        margin: 8px 10px 4px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .ri {
        display: grid;
        grid-template-columns: 1.4rem 1fr auto;
        align-items: baseline;
        gap: 6px;
        padding: 8px 10px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-size: 14px;
        cursor: pointer;
      }
      .ri .ic {
        color: var(--faint);
        font-weight: 600;
      }
      .ri .d {
        color: var(--muted);
        font-size: 12px;
      }
      .ri.sel {
        box-shadow: var(--inset);
        color: var(--ink);
      }
      .ri mark {
        background: none;
        color: var(--accent);
        font-weight: 600;
      }
      .detail {
        padding: 6px 10px;
        border-radius: var(--r-md);
        box-shadow: var(--inset);
        font-size: 13px;
        color: var(--ink-2);
      }

      /* ───────────── Manuscript: list items (drawer) ───────────── */
      .ms {
        flex: 1;
        overflow: auto;
        padding: 4px 0 10px;
      }
      .ms .ch {
        display: flex;
        justify-content: space-between;
        margin: 12px 18px 4px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }
      .ms .ch span:last-child {
        color: var(--faint);
        font-weight: 500;
      }
      .ms .sc {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 2px 12px;
        padding: 7px 10px 7px 14px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-size: 13px;
        cursor: pointer;
      }
      .ms .sc.act {
        box-shadow: var(--inset);
        color: var(--ink);
      }
      .ms .sc .m {
        color: var(--faint);
        font-size: 11.5px;
      }
      .ms .sc .dots {
        color: var(--accent);
      }
      .ms .sub {
        margin: 6px 16px 8px 26px;
        padding-left: 12px;
        border-left: 1px solid color-mix(in srgb, var(--sh) 70%, transparent);
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .ms .sub .h {
        margin: 6px 0 4px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ms .sub .v {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
      }
      .ms .sub .v.on {
        color: var(--accent);
      }
      .ms .sub .v span:last-child {
        color: var(--faint);
      }

      /* Manuscript: overview board (Vélin) */
      .board {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 28px 18px;
        animation: zoom 0.34s var(--ease) both;
      }
      @keyframes zoom {
        from {
          opacity: 0;
          transform: scale(1.03);
        }
      }
      .board h2 {
        margin: 0 0 4px;
        font: 500 26px var(--font-text);
      }
      .board .sub2 {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .cols {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px;
        overflow: auto;
      }
      .col h3 {
        display: flex;
        justify-content: space-between;
        margin: 0 4px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .col h3 span {
        color: var(--faint);
        font-weight: 500;
      }
      .card {
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: var(--r-md);
        box-shadow: var(--raise-s);
        cursor: pointer;
      }
      .card.act {
        box-shadow: var(--inset);
        outline: 1.5px solid var(--accent);
        outline-offset: 3px;
      }
      .card .n {
        color: var(--faint);
        font-size: 11px;
      }
      .card .t {
        margin: 2px 0 8px;
        font: 500 17px/1.25 var(--font-text);
      }
      .card .m {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }
      .card .m .dots {
        color: var(--accent);
        letter-spacing: 2px;
      }
      .strip {
        flex: none;
        display: flex;
        gap: 26px;
        align-items: center;
        margin-top: 10px;
        padding: 12px 18px;
        border-radius: var(--r-lg);
        box-shadow: var(--raise);
        font-size: 13px;
        color: var(--ink-2);
      }
      .strip .h {
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-right: 8px;
      }
      .chip {
        display: inline-block;
        margin: 2px 4px 2px 0;
        padding: 4px 9px;
        border-radius: var(--r-sm);
        box-shadow: var(--raise-s);
        font-size: 12px;
      }
      .chip.on {
        box-shadow: var(--inset);
        color: var(--accent);
      }

      /* ───────────── Atelier (modules) ───────────── */
      .atelier {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 13.5rem 16.5rem minmax(0, 1fr);
        gap: 22px;
        padding: 10px 22px 18px;
        animation: zoom 0.3s var(--ease) both;
      }
      .rail,
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .rail .seg {
        margin: 0 0 12px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-size: 13.5px;
        cursor: pointer;
      }
      .nav.on {
        box-shadow: var(--inset);
        color: var(--ink);
        font-weight: 500;
      }
      .nav .n {
        color: var(--accent);
        font-size: 12px;
      }
      .list .field {
        margin: 0 0 6px;
      }
      .ent {
        padding: 10px 12px;
        border-radius: var(--r-md);
        cursor: pointer;
        font-size: 13.5px;
      }
      .ent .s {
        color: var(--muted);
        font-size: 11.5px;
      }
      .ent.on {
        box-shadow: var(--inset);
      }
      .ent.prop {
        box-shadow: var(--raise-s);
        color: var(--accent);
      }
      .ent.prop .s {
        color: var(--accent);
        opacity: 0.8;
      }
      .fiche {
        overflow: auto;
        padding: 4px 16px 30px 10px;
        container-type: inline-size;
      }
      @container (max-width: 46rem) {
        .fiche .secs {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @container (max-width: 24rem) {
        .fiche .fld {
          grid-template-columns: minmax(0, 1fr);
        }
        .fiche .fld .fm {
          grid-column: 1;
        }
      }
      @media (max-width: 1100px) {
        .atelier {
          grid-template-columns: 12rem minmax(0, 1fr);
        }
        .atelier .list {
          display: none;
        }
      }
      .fiche h1 {
        margin: 0;
        font: 500 30px/1.15 var(--font-text);
      }
      .fiche .lead {
        margin: 4px 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .legend i {
        display: inline-block;
        width: 26px;
        height: 14px;
        margin-right: 6px;
        border-radius: 4px;
        vertical-align: -2px;
      }
      .legend .lp {
        box-shadow: var(--raise-s);
      }
      .legend .lv {
        box-shadow: var(--inset);
      }
      .legend .lr {
        border: 1px dashed var(--faint);
        opacity: 0.7;
      }
      .legend .lc {
        box-shadow: var(--inset);
        position: relative;
      }
      .legend .lc::after {
        content: '!';
        position: absolute;
        right: 3px;
        top: -1px;
        color: var(--accent);
        font-weight: 700;
        font-size: 11px;
        font-style: normal;
      }
      .secs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 30px;
      }
      .sec h2 {
        margin: 14px 0 8px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sec.wide {
        grid-column: 1 / -1;
      }
      .fld {
        display: grid;
        grid-template-columns: 8.5rem 1fr;
        align-items: start;
        gap: 4px 12px;
        margin-bottom: 10px;
      }
      .fld .fl {
        padding-top: 8px;
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .fld .fv {
        position: relative;
        padding: 7px 12px;
        border-radius: var(--r-sm);
        font-family: var(--font-text);
        font-size: 15.5px;
        line-height: 1.45;
        transition:
          box-shadow 0.35s var(--ease),
          color 0.35s,
          opacity 0.35s;
      }
      .fld .fm {
        grid-column: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .fld[data-st='validated'] .fv,
      .fld[data-st='contradicted'] .fv {
        box-shadow: var(--inset);
      }
      .fld[data-st='proposed'] .fv {
        box-shadow: var(--raise-s);
        color: var(--accent);
        font-style: italic;
      }
      .fld[data-st='proposed'] .fm {
        color: var(--accent);
      }
      .fld[data-st='rejected'] .fv {
        opacity: 0.45;
        text-decoration: line-through;
        text-decoration-color: var(--muted);
      }
      .fld[data-st='contradicted'] .fv {
        padding-right: 30px;
      }
      .fld[data-st='contradicted'] .fv::after {
        content: '!';
        position: absolute;
        right: 6px;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        border-radius: 50%;
        box-shadow: var(--raise-s);
        color: var(--accent);
        font: 700 11px var(--font-ui);
        font-style: normal;
      }
      .fld[data-st='contradicted'] .fm {
        color: var(--accent);
      }
      .fld[data-st='empty'] .fv {
        border: 1px dashed color-mix(in srgb, var(--faint) 70%, transparent);
        color: var(--faint);
        font-family: var(--font-ui);
        font-size: 13px;
      }
      .fm .btn {
        padding: 3px 8px;
        font-size: 11.5px;
      }
      .fm a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      /* Quick sheet (volet) over the scene */
      .panel.volet .fiche {
        padding: 18px 18px 20px;
      }
      .panel.volet .fiche h1 {
        font-size: 24px;
      }
      .panel.volet .fld {
        grid-template-columns: 1fr;
        gap: 3px;
      }
      .panel.volet .fld .fl {
        padding-top: 0;
      }
      .panel.volet .fld .fm {
        grid-column: 1;
      }

      /* ───────────── Personality levers (A, B, C) ───────────── */
      /* A · Pierre chaude: the Perle structure on a warm stone neutral. */
      .app[data-dir='perle'][data-warm='true'][data-theme='light'] {
        --bg: #e5e2dc;
        --ink: #262320;
        --ink-2: #4a4540;
        --muted: #7d766d;
        --faint: #aaa398;
        --hl: #ffffff;
        --sh: #c4beb4;
      }
      .app[data-dir='perle'][data-warm='true'][data-theme='dark'] {
        --bg: #2a2825;
        --ink: #e6e1d9;
        --ink-2: #bfb8ad;
        --muted: #8f877c;
        --faint: #5f5953;
        --hl: #36332f;
        --sh: #1b1a18;
      }
      /* B · Deux encres: vermilion for the author, Prussian blue for the Compagnon. */
      .app {
        --author: var(--ink);
      }
      .app[data-ink='true'][data-theme='light'] {
        --author: #b2432a;
      }
      .app[data-ink='true'][data-theme='dark'] {
        --author: #e3876a;
      }
      .app[data-ink='true'] ::selection {
        background: color-mix(in srgb, var(--author) 24%, transparent);
      }
      .app[data-ink='true'] .caret {
        width: 2px;
        background: var(--author);
      }
      .app[data-ink='true'] .whead .cur,
      .app[data-ink='true'] .today,
      .app[data-ink='true'] .seg button.on,
      .app[data-ink='true'] .nav.on,
      .app[data-ink='true'] .ent.on,
      .app[data-ink='true'] .ms .sc.act,
      .app[data-ink='true'] .chip.on,
      .app[data-ink='true'] .ms .sub .v.on,
      .app[data-ink='true'] .tb .ttl {
        color: var(--author);
      }
      .app[data-ink='true'] .ms .sc.act,
      .app[data-ink='true'] .nav.on,
      .app[data-ink='true'] .ent.on {
        box-shadow:
          var(--inset),
          inset 3px 0 0 var(--author);
      }
      .app[data-ink='true'] .card.act {
        outline-color: var(--author);
      }
      .app[data-ink='true'] .fld[data-st='validated'] .fv {
        box-shadow:
          var(--inset),
          inset 2px 0 0 color-mix(in srgb, var(--author) 70%, transparent);
      }
      .app[data-ink='true'] .msg.a .who2 {
        color: var(--author);
      }
      /* C · Signature: editorial typography (small caps, scene opener, serif labels). */
      .opener {
        grid-column: 2;
        margin: 0 0 3.2rem;
        text-align: center;
        font-family: var(--font-text);
        color: var(--ink-2);
      }
      .opener .cn {
        font-size: 2.6rem;
        font-weight: 400;
        line-height: 1;
        color: var(--author);
      }
      .opener .ct {
        margin-top: 0.4rem;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.14em;
        font-size: 1.15rem;
      }
      .opener .orn {
        margin: 0.9rem 0 0.5rem;
        color: var(--faint);
        font-size: 1.1rem;
      }
      .opener .st {
        font-style: italic;
        font-size: 1.25rem;
        color: var(--ink);
      }
      .app[data-sig='true'] .whead,
      .app[data-sig='true'] .tb .ttl {
        font-family: var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.1em;
        font-size: 14.5px;
      }
      .app[data-sig='true'] .whead .cur {
        font-variant-caps: normal;
        font-style: italic;
        letter-spacing: 0.01em;
        font-size: 14px;
      }
      .app[data-sig='true'] .nk,
      .app[data-sig='true'] .gh,
      .app[data-sig='true'] .rg,
      .app[data-sig='true'] .sec h2,
      .app[data-sig='true'] .ms .sub .h,
      .app[data-sig='true'] .strip .h,
      .app[data-sig='true'] .pt .k,
      .app[data-sig='true'] .ex .lab,
      .app[data-sig='true'] .msg .who2 {
        font-family: var(--font-text);
        font-weight: 500;
        text-transform: none;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        font-size: 13.5px;
      }
      .app[data-sig='true'] .nk span:last-child {
        font-variant-caps: normal;
        font-style: italic;
        letter-spacing: 0;
        font-size: 12.5px;
      }
      .app[data-sig='true'] .ms .ch,
      .app[data-sig='true'] .col h3 {
        font-family: var(--font-text);
        font-weight: 500;
        font-size: 15px;
      }
      .app[data-sig='true'] .nt {
        font-family: var(--font-text);
        font-weight: 500;
        font-size: 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        .app *,
        .app *::before,
        .app *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      .app.still *,
      .app.still *::before,
      .app.still *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

      /* ───────────── Discoverability: entry points (« Découverte ») ───────────── */
      .chrome {
        transition:
          opacity 0.5s var(--ease),
          box-shadow 0.2s,
          color 0.2s;
      }
      .app[data-quiet='true'] .chrome {
        opacity: 0;
        pointer-events: none;
      }
      /* macOS menu bar (Mac frame only: the system draws it above the window). */
      .menubar {
        flex: none;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 10px;
        background: color-mix(in srgb, var(--bg) 70%, #fff 30%);
        color: var(--ink);
        font:
          13px/1 -apple-system,
          system-ui,
          sans-serif;
        position: relative;
        z-index: 20;
      }
      .app[data-theme='dark'] .menubar {
        background: color-mix(in srgb, var(--bg) 80%, #000 20%);
      }
      .menubar .mi {
        position: relative;
        padding: 4px 9px;
        border-radius: 5px;
        cursor: default;
      }
      .menubar .mi:first-child {
        font-weight: 700;
      }
      .menubar .mi.on {
        background: color-mix(in srgb, var(--ink) 14%, transparent);
      }
      .mdd {
        position: absolute;
        top: calc(100% + 3px);
        left: 0;
        min-width: 300px;
        padding: 5px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--bg) 88%, #fff 12%);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.22),
          0 0 0 0.5px rgba(0, 0, 0, 0.18);
        font-weight: 400;
      }
      .app[data-theme='dark'] .mdd {
        background: #30353d;
      }
      .mdd div {
        display: flex;
        justify-content: space-between;
        gap: 28px;
        padding: 4px 10px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .mdd div:hover {
        background: var(--accent);
        color: #fff;
      }
      .mdd div span:last-child {
        color: var(--muted);
      }
      .mdd div:hover span:last-child {
        color: #fff;
      }
      .mdd hr {
        border: 0;
        border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
        margin: 5px 10px;
      }
      /* Direction 1: handles on the edges, where the panels come from. */
      .edge {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px 8px 12px;
        border: 0;
        background: var(--bg);
        box-shadow: var(--raise-s);
        color: var(--muted);
        cursor: pointer;
      }
      .edge:hover {
        color: var(--ink);
        box-shadow: var(--raise);
      }
      .edge.l {
        left: 0;
        border-radius: 0 var(--r-md) var(--r-md) 0;
      }
      .edge.r {
        right: 0;
        border-radius: var(--r-md) 0 0 var(--r-md);
      }
      .edge .v {
        writing-mode: vertical-rl;
        font: 500 13.5px var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
      }
      .edge.l .v {
        transform: rotate(180deg);
      }
      .edge .n {
        min-width: 18px;
        padding: 2px 0;
        border-radius: 9px;
        box-shadow: var(--inset);
        color: var(--accent);
        font: 600 11px var(--font-ui);
      }
      .modes {
        position: absolute;
        top: 10px;
        right: 16px;
        z-index: 4;
        display: flex;
        padding: 3px;
        border-radius: var(--r-sm);
        box-shadow: var(--inset);
      }
      .modes button {
        padding: 5px 11px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: 500 12px var(--font-ui);
        cursor: pointer;
      }
      .modes button.on {
        box-shadow: var(--raise-s);
        color: var(--author, var(--ink));
      }
      /* The command zone, always in the footer: the beginner's way into everything. */
      .cmdz {
        position: absolute;
        left: 50%;
        bottom: -5px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(30rem, 38%);
        padding: 7px 12px;
        border: 0;
        border-radius: var(--r-md);
        background: var(--bg);
        box-shadow: var(--inset);
        color: var(--faint);
        font: 13px var(--font-ui);
        text-align: left;
        pointer-events: auto;
        cursor: text;
      }
      .cmdz.inl {
        position: static;
        transform: none;
        width: auto;
        margin-top: auto;
      }
      .list > .btn {
        justify-content: center;
        margin: 2px 0 10px;
      }
      .cmdz:hover {
        color: var(--muted);
      }
      .cmdz .pr {
        color: var(--accent);
        font-size: 15px;
      }
      .cmdz .grow {
        flex: 1;
      }
      .wfoot .tbtn,
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--muted);
        font: 500 12px var(--font-ui);
        pointer-events: auto;
        cursor: pointer;
      }
      .tbtn:hover {
        color: var(--ink);
        box-shadow: var(--raise-s);
      }
      .tbtn.on {
        box-shadow: var(--inset);
        color: var(--ink);
      }
      .tbtn .n {
        color: var(--accent);
        font-weight: 600;
      }
      .tbtn.aa {
        font: 500 13px var(--font-text);
      }
      /* Display popover (Aa): text size, column, focus, theme. */
      .aapop {
        position: absolute;
        right: 14px;
        bottom: 44px;
        z-index: 7;
        width: 19rem;
        padding: 12px 14px;
        border-radius: var(--r-lg);
        background: var(--bg);
        box-shadow: var(--raise);
        font-size: 12.5px;
        animation: rise 0.22s var(--ease) both;
      }
      .aapop.top {
        top: 8px;
        bottom: auto;
      }
      .aapop .ar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        color: var(--ink-2);
      }
      .aapop .ar > span:first-child {
        flex: 1;
      }
      .aapop .ttl {
        font: 500 13.5px var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      /* Direction 2: panels docked open beside the page. */
      .write.with-left {
        left: 23.5rem;
      }
      .panel.docked {
        animation: none;
      }
      /* Direction 3: a labelled toolbar in the title bar. */
      .app[data-disc='barre'] .tb {
        display: flex;
        height: 42px;
      }
      .tb .tools {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: 14px;
      }
      .tb .tools.r {
        margin-left: auto;
      }
      .tb .tools .modes {
        position: static;
        margin-right: 6px;
      }
      .app[data-frame='x250'] .tb .lights {
        display: none;
      }
      /* First launch: placeholder and the tour. */
      .pwelcome {
        padding: 6px 14px;
      }
      .pwelcome .note {
        position: relative;
        left: 0;
        top: 0;
        width: auto;
      }
      .para.ph {
        color: var(--faint);
        font-style: italic;
      }
      .note.welcome ul {
        margin: 8px 0 4px;
        padding-left: 18px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .note.welcome li + li {
        margin-top: 4px;
      }
      .tour-on {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        opacity: 1 !important;
      }
      .tip {
        position: absolute;
        z-index: 30;
        width: 17rem;
        padding: 12px 14px;
        border-radius: var(--r-md);
        background: var(--bg);
        box-shadow: var(--raise);
        font-size: 13px;
        line-height: 1.45;
        color: var(--ink-2);
        animation: rise 0.22s var(--ease) both;
      }
      .tip b {
        display: block;
        margin-bottom: 4px;
        color: var(--accent);
        font: 500 13.5px var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
      }
      .tip .na {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tip .na .step {
        margin-left: auto;
        color: var(--faint);
        font-size: 11.5px;
      }
      /* ───────────── Finishing touches (v1.2) ───────────── */
      /* Rejects: a toggle in the legend, hidden by default. */
      .legend .lgt {
        padding: 2px 8px 2px 4px;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .legend .lgt:hover,
      .legend .lgt.on {
        box-shadow: var(--raise-s);
        color: var(--ink);
      }
      .legend .lgt u {
        text-underline-offset: 2px;
      }
      .fm .rj {
        color: var(--faint);
        cursor: pointer;
      }
      .fm .rj:hover {
        color: var(--muted);
        text-decoration: underline;
      }
      .fld .rh {
        grid-column: 2;
        color: var(--muted);
        font-size: 11.5px;
      }
      .fld .rh s {
        opacity: 0.7;
        font-family: var(--font-text);
        font-size: 13px;
      }
      .ent.rej {
        opacity: 0.45;
      }
      .ent.rej > div > div:first-child {
        text-decoration: line-through;
      }
      .list .lfoot {
        margin-top: 6px;
        color: var(--faint);
        font-size: 11.5px;
        cursor: pointer;
      }
      .list .lfoot:hover {
        color: var(--muted);
      }
      /* Overview strip: the last checkpoints and a preview of the chosen one. */
      .strip {
        position: relative;
      }
      .chip.cp {
        cursor: pointer;
      }
      .chip.cp .d {
        color: var(--muted);
      }
      .chip.more {
        box-shadow: none;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .cprev {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 34%;
        width: 27rem;
        padding: 14px 16px;
        border-radius: var(--r-md);
        background: var(--bg);
        box-shadow: var(--raise);
        animation: rise 0.22s var(--ease) both;
        z-index: 3;
      }
      .cprev .h2 {
        font: 500 13.5px var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .cprev .x {
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: var(--r-sm);
        box-shadow: var(--inset);
        font: italic 14px/1.5 var(--font-text);
        color: var(--ink-2);
      }
      .cprev .dw {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .cprev .na {
        display: flex;
        gap: 8px;
      }
      /* Library. */
      .lib {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 9vh 0 40px;
      }
      .lib .in {
        width: min(46rem, calc(100% - 4rem));
        margin: 0 auto;
      }
      .lib .top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .lib h1 {
        flex: 1;
        margin: 0;
        font: 500 22px var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        color: var(--author, var(--ink));
      }
      .lib .hint {
        color: var(--faint);
        font-size: 11.5px;
        margin-bottom: 22px;
      }
      .proj {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 4px 14px;
        margin-bottom: 14px;
        padding: 14px 18px;
        border-radius: var(--r-md);
        box-shadow: var(--raise-s);
      }
      .proj.on {
        box-shadow: var(--inset);
        border-left: 2px solid var(--author, var(--ink));
      }
      .proj .t {
        font: 500 19px var(--font-text);
      }
      .proj .m {
        grid-column: 1;
        color: var(--muted);
        font-size: 12px;
      }
      .proj .acts {
        grid-row: 1 / 3;
        grid-column: 2;
        display: flex;
        gap: 8px;
        opacity: 0;
      }
      .proj:hover .acts,
      .proj.on .acts {
        opacity: 1;
      }
      .lib .foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-top: 26px;
        padding-top: 14px;
        border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
        color: var(--muted);
        font-size: 12px;
      }
      .lib .foot a {
        color: var(--ink-2);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      /* ───────────── Character levers (« Caractère ») ───────────── */
      .app {
        --praise: var(--raise);
        --praise-s: var(--raise-s);
        --on-ink: #fff;
      }
      .app[data-theme='dark'] {
        --on-ink: #1e2126;
      }
      /* Zones re-resolve the relief with their own material, and sit on the page with the page's shadows. */
      .app:not([data-mat='none'])
        :is(
          .panel,
          .edge,
          .atelier .rail,
          .atelier .list,
          .board .card,
          .board .strip,
          .proj,
          .cmdres,
          .cmdbar,
          .aapop,
          .cprev,
          .note,
          .tip
        ) {
        --raise:
          var(--d) var(--d) var(--b) var(--sh),
          calc(var(--d) * -1) calc(var(--d) * -1) var(--b) var(--hl);
        --raise-s:
          var(--ds) var(--ds) var(--bs) var(--sh),
          calc(var(--ds) * -1) calc(var(--ds) * -1) var(--bs) var(--hl);
        --inset:
          inset var(--ds) var(--ds) var(--bs) var(--sh),
          inset calc(var(--ds) * -1) calc(var(--ds) * -1) var(--bs) var(--hl);
        background: var(--bg);
        color: var(--ink);
      }
      .app:not([data-mat='none'])
        :is(
          .panel,
          .atelier .rail,
          .atelier .list,
          .board .strip,
          .cmdres,
          .aapop,
          .cprev,
          .note,
          .tip
        ) {
        box-shadow: var(--praise);
      }
      .app:not([data-mat='none']) :is(.edge, .board .card:not(.act), .proj:not(.on)) {
        box-shadow: var(--praise-s);
      }
      .app:not([data-mat='none']) .atelier :is(.rail, .list) {
        padding: 14px 12px;
        border-radius: var(--r-lg);
      }
      .app:not([data-mat='none']) .atelier {
        padding-top: 14px;
      }
      /* M · Matières: one material per place. */
      .app[data-mat='teintes'][data-theme='light']
        :is(.panel:not(.left):not(.volet), .note, .tip, .edge.r) {
        --bg: #d6e1ee;
        --hl: #f3f8ff;
        --sh: #a6b7cb;
      }
      .app[data-mat='teintes'][data-theme='light'] :is(.panel.left, .edge.l, .board .card, .proj) {
        --bg: #eee8db;
        --hl: #fffdf5;
        --sh: #c9bfad;
      }
      .app[data-mat='teintes'][data-theme='light']
        :is(.atelier .rail, .atelier .list, .panel.volet) {
        --bg: #e9dcd3;
        --hl: #fff7f1;
        --sh: #c7b6aa;
      }
      .app[data-mat='teintes'][data-theme='dark']
        :is(.panel:not(.left):not(.volet), .note, .tip, .edge.r) {
        --bg: #212c3a;
        --hl: #2c394a;
        --sh: #151c26;
      }
      .app[data-mat='teintes'][data-theme='dark'] :is(.panel.left, .edge.l, .board .card, .proj) {
        --bg: #302d26;
        --hl: #3c3931;
        --sh: #1f1d19;
      }
      .app[data-mat='teintes'][data-theme='dark']
        :is(.atelier .rail, .atelier .list, .panel.volet) {
        --bg: #352b26;
        --hl: #42362f;
        --sh: #231c18;
      }
      /* N · Établi sombre: the tools are slate, the page stays light. */
      .app[data-mat='ardoise'][data-theme='light']
        :is(
          .panel,
          .edge,
          .atelier .rail,
          .atelier .list,
          .board .strip,
          .cmdres,
          .cmdbar,
          .aapop,
          .cprev,
          .tip
        ) {
        --bg: #2b3038;
        --hl: #383e48;
        --sh: #1b1e24;
        --ink: #dfe3ea;
        --ink-2: #b9c0ca;
        --muted: #8a929e;
        --faint: #5d6470;
        --accent: #86aedb;
        --accent-soft: rgba(134, 174, 219, 0.13);
      }
      .app[data-mat='ardoise'][data-ink='true'][data-theme='light']
        :is(
          .panel,
          .edge,
          .atelier .rail,
          .atelier .list,
          .board .strip,
          .cmdres,
          .cmdbar,
          .aapop,
          .cprev,
          .tip
        ) {
        --author: #e3876a;
        --on-ink: #1e2126;
      }
      .app[data-mat='ardoise'][data-theme='dark']
        :is(
          .panel,
          .edge,
          .atelier .rail,
          .atelier .list,
          .board .strip,
          .cmdres,
          .cmdbar,
          .aapop,
          .cprev,
          .tip
        ) {
        --bg: #1a1d22;
        --hl: #24282f;
        --sh: #0f1114;
      }

      .app[data-mat='ardoise'] .cmdbar::before {
        display: none;
      }
      .app[data-mat='ardoise'] .cmdbar {
        box-shadow: var(--praise);
      }

      /* Dark theme, variant « outils clairs »: the same slate as in the light theme, on a deeper page. */
      .app[data-mat='ardoise'][data-dk='clair'][data-theme='dark'] {
        --bg: #1b1e23;
        --hl: #262a31;
        --sh: #101215;
      }
      .app[data-mat='ardoise'][data-dk='clair'][data-theme='dark']
        :is(
          .panel,
          .edge,
          .atelier .rail,
          .atelier .list,
          .board .strip,
          .cmdres,
          .cmdbar,
          .aapop,
          .cprev,
          .tip
        ) {
        --bg: #2b3038;
        --hl: #383e48;
        --sh: #1b1e24;
      }

      /* Panel titles (shown with any lever). */
      .phead {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px 4px;
      }
      .phead .ph-t {
        font: 500 19px/1.1 var(--font-text);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        color: var(--ink-2);
      }
      .phead.c .ph-t {
        font-style: italic;
        font-variant-caps: normal;
        letter-spacing: 0;
        color: var(--accent);
      }
      .phead .ph-s {
        margin-left: auto;
        color: var(--muted);
        font-size: 11.5px;
        text-align: right;
      }
      .pic {
        display: none;
      }

      /* E · Encres pleines: the two inks fill what is active. */
      .app[data-full='true'] :is(.seg button.on, .modes button.on) {
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--author) 82%, #fff),
          var(--author)
        );
        color: var(--on-ink);
        box-shadow:
          2px 2px 6px var(--sh),
          -2px -2px 6px var(--hl);
      }
      .app[data-full='true'] .seg button.on .n {
        color: var(--on-ink);
        opacity: 0.85;
      }
      .app[data-full='true'] :is(.note, .tip, .panel:not(.left), .fm, .pt) .btn.pri {
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--accent) 80%, #fff),
          var(--accent)
        );
        color: var(--on-ink);
      }
      .app[data-full='true'] :is(.lib, .cprev, .proj) .btn.pri {
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--author) 82%, #fff),
          var(--author)
        );
        color: var(--on-ink);
      }
      .app[data-full='true'] .btn.pri kbd {
        color: inherit;
        opacity: 0.7;
      }
      .app[data-full='true'] :is(.nav .n:not(:empty), .edge .n, .tbtn .n) {
        min-width: 18px;
        padding: 1px 6px;
        border-radius: 9px;
        background: var(--accent);
        box-shadow: none;
        color: var(--on-ink);
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }
      .app[data-full='true'] :is(.nav.on, .ent.on, .ms .sc.act, .proj.on) {
        background: color-mix(in srgb, var(--author) 10%, transparent);
      }
      .app[data-full='true'] :is(.fld[data-st='proposed'] .fv, .ent.prop) {
        background: var(--accent-soft);
      }
      .app[data-full='true'] .pt {
        border-left: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      }
      .app[data-full='true'] .pt:has(.pst[data-l='3']) {
        border-left-color: var(--accent);
      }
      .app[data-full='true'] .phead {
        margin: 0 0 4px;
        padding: 13px 18px 12px;
        border-radius: var(--r-lg) var(--r-lg) 0 0;
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--author) 82%, #fff),
          var(--author)
        );
      }
      .app[data-full='true'] .phead.c {
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--accent) 80%, #fff),
          var(--accent)
        );
      }
      .app[data-full='true'] .phead :is(.ph-t, .ph-s, .pic) {
        color: var(--on-ink);
      }
      .app[data-full='true'] .phead .ph-s {
        opacity: 0.8;
      }

      /* O · Outils gravés: engraved tools, monograms, letterpress. */
      .app[data-orn='true'] .pic {
        flex: none;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        box-shadow: var(--raise-s);
        color: var(--ink-2);
      }
      .app[data-orn='true'] .pic svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app[data-orn='true'] .phead.c .pic {
        color: var(--accent);
      }
      .app[data-orn='true'][data-full='true'] .phead .pic {
        box-shadow:
          inset 2px 2px 5px rgba(0, 0, 0, 0.25),
          inset -2px -2px 5px rgba(255, 255, 255, 0.2);
      }
      .app[data-orn='true'] .nav {
        justify-content: flex-start;
        align-items: center;
        gap: 10px;
        padding: 6px 10px 6px 6px;
      }
      .app[data-orn='true'] .nav .pic {
        width: 30px;
        height: 30px;
      }
      .app[data-orn='true'] .nav.on .pic {
        box-shadow: var(--inset);
        color: var(--author, var(--ink));
      }
      .app[data-orn='true'] .nav .n {
        margin-left: auto;
      }
      .mono {
        display: none;
      }
      .app[data-orn='true'] .mono {
        flex: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        box-shadow: var(--raise-s);
        font: 500 15px var(--font-text);
        color: var(--ink-2);
      }
      .app[data-orn='true'] .ent {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app[data-orn='true'] .ent.on .mono {
        box-shadow: var(--inset);
        color: var(--author, var(--ink));
      }
      .app[data-orn='true'] .ent.prop .mono {
        color: var(--accent);
        font-style: italic;
      }
      .app[data-orn='true'] .fiche h1 {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .app[data-orn='true'] .fiche h1 .mono {
        width: 62px;
        height: 62px;
        box-shadow: var(--raise);
        font-size: 34px;
        color: var(--author, var(--ink));
      }
      /* Letterpress: titles pressed into the material. */
      .app[data-orn='true'] :is(.gh, .sec h2, .fiche .sec > h2) {
        display: flex;
        align-items: center;
        gap: 10px;
        text-shadow: 0 1px 0 var(--hl);
      }
      .app[data-orn='true'] :is(.gh, .sec h2)::after {
        content: '';
        flex: 1;
        height: 0;
        border-top: 1px solid var(--sh);
        border-bottom: 1px solid var(--hl);
      }
      .wm {
        display: none;
      }
      .app[data-orn='true'] .wm {
        display: block;
        position: absolute;
        right: 14px;
        bottom: 34px;
        font: 600 150px/1 var(--font-text);
        color: var(--bg);
        text-shadow:
          -1.5px -1.5px 1px var(--sh),
          1.5px 1.5px 1px var(--hl);
        pointer-events: none;
        user-select: none;
        opacity: 0.9;
      }
      .app[data-orn='true'] .ms {
        position: relative;
        z-index: 1;
      }
      .app[data-orn='true'] .ms .ch::before {
        content: '⁂';
        margin-right: 8px;
        color: var(--faint);
        font-weight: 400;
      }
      .app[data-orn='true'] .ms .ch {
        justify-content: flex-start;
        font: 500 15px var(--font-text);
      }
      .app[data-orn='true'] .ms .ch span:last-child {
        margin-left: auto;
        font: 500 12px var(--font-ui);
      }

      /* Quiet scrollbars: no track, a thin thumb in the material's own muted tone. */
      .app,
      .app * {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--muted) 40%, transparent) transparent;
      }
      /* ───────────── X250: the system line (« ligne système ») ───────────── */
      .app {
        --font-sys: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }
      /* The system's own material: the deepest on screen, in both themes. */
      .sysmat {
        --bg: #14161a;
        --hl: #20242a;
        --sh: #090a0c;
        --ink: #dfe3ea;
        --ink-2: #b9c0ca;
        --muted: #8a929e;
        --faint: #555b66;
        --accent: #86aedb;
        --accent-soft: rgba(134, 174, 219, 0.13);
        --author: #e3876a;
        --on-ink: #14161a;
        --raise:
          var(--d) var(--d) var(--b) var(--sh),
          calc(var(--d) * -1) calc(var(--d) * -1) var(--b) var(--hl);
        --raise-s:
          var(--ds) var(--ds) var(--bs) var(--sh),

        app.appendChild(tip);
        const a = app.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth;
        const h = tip.offsetHeight;
        let x = r.left - a.left + r.width / 2 - w / 2;
        let y = r.bottom - a.top + 14;
        if (r.left - a.left < 40) {
          x = r.right - a.left + 16;
          y = r.top - a.top + r.height / 2 - h / 2;

        ac ||= new AudioContext();
        const t = ac.currentTime;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t);
        o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.09);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        o.connect(g).connect(ac.destination);
        o.start(t);
        o.stop(t + 0.15);

      const norm = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
      function match(text, q) {
        if (!q) return text;

        const hits = [];
        for (let i = 0; i < t.length && j < nq.length; i++) if (t[i] === nq[j]) (hits.push(i), j++);
        if (j < nq.length) return null;
        // Prefer contiguous substring highlighting when available.
        const at = t.indexOf(nq);

      // ───────────── X250: the monitor ─────────────
      const series = (seed, n, base, amp, burst = 0) => {
        let x = seed;
        const rnd = () => ((x = (x * 9301 + 49297) % 233280), x / 233280);
        let v = base;
        return Array.from({ length: n }, (_, i) => {
          v += (rnd() - 0.5) * amp;
          v = Math.max(base * 0.4, Math.min(base * 1.8, v));
          return Math.max(0, Math.min(100, v + (burst && i > n * 0.62 && i < n * 0.7 ? burst : 0)));
        });
      };
      const BLOCKS = '▁▂▃▄▅▆▇█';
      const spark = (vals, max = 100) =>
        `<span class="spark">${vals.map((v) => BLOCKS[Math.min(7, Math.floor((v / max) * 8))]).join('')}</span>`;
      const CPU = series(7, 120, 14, 9, 46);
      function chart(lines, max = 100) {
        const path = (vals) =>
          vals
            .map(
              (v, i) =>
                `${i ? 'L' : 'M'}${((i / (vals.length - 1)) * 300).toFixed(1)} ${(58 - (v / max) * 54).toFixed(1)}`,
            )
            .join(' ');
        const grid = [15, 30, 45]
          .map(
            (y) =>
              `<path d="M0 ${y}H300" stroke="var(--faint)" stroke-width="0.5" stroke-dasharray="1 5"/>`,
          )
          .join('');
        return `<svg class="ch" viewBox="0 0 300 60" preserveAspectRatio="none">${grid}${lines
          .map(
            (vals, i) =>
              `${i === 0 ? `<path d="${path(vals)} L300 60 L0 60 Z" fill="var(--ink-2)" opacity="0.08"/>` : ''}<path d="${path(vals)}" fill="none" stroke="${i === 0 ? 'var(--ink)' : 'var(--muted)'}" stroke-width="${i === 0 ? 1.4 : 1}" vector-effect="non-scaling-stroke"${i ? ' stroke-dasharray="3 3"' : ''}/>`,
          )
          .join('')}</svg>`;
      }
      const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
      function monitor() {
        const c = (title, value, body, cls = '') =>
