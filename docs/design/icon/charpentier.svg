<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>Charpentier</title>
<defs>
  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#d8dde5"/>
  </linearGradient>
  <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
    <feOffset dy="12" result="b"/>
    <feFlood flood-color="#000" flood-opacity="0.28"/>
    <feComposite in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="raise" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
    <feOffset in="b" dx="16" dy="16" result="o1"/>
    <feFlood flood-color="#b3becc"/><feComposite in2="o1" operator="in" result="dark"/>
    <feOffset in="b" dx="-16" dy="-16" result="o2"/>
    <feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="light"/>
    <feMerge><feMergeNode in="dark"/><feMergeNode in="light"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
    <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
    <feOffset in="inv" dx="12" dy="12" result="i1"/><feGaussianBlur in="i1" stdDeviation="9" result="i1b"/>
    <feFlood flood-color="#b3becc"/><feComposite in2="i1b" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="dark"/>
    <feOffset in="inv" dx="-12" dy="-12" result="i2"/><feGaussianBlur in="i2" stdDeviation="9" result="i2b"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.9"/><feComposite in2="i2b" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="light"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
  </filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#drop)"/>
<path d="M 270 230 H 390 V 650 H 770 V 770 H 270 Z" fill="#d8dde5" filter="url(#inset)"/>
<path d="M 390 230 V 650 H 770" fill="none" stroke="#b2432a" stroke-width="16" stroke-linejoin="miter"/>
<rect x="447" y="650" width="6" height="54" fill="#7a828e"/><rect x="495" y="650" width="6" height="34" fill="#7a828e"/><rect x="543" y="650" width="6" height="54" fill="#7a828e"/><rect x="591" y="650" width="6" height="34" fill="#7a828e"/><rect x="639" y="650" width="6" height="54" fill="#7a828e"/><rect x="687" y="650" width="6" height="34" fill="#7a828e"/><rect x="735" y="650" width="6" height="54" fill="#7a828e"/><rect x="336" y="287" width="54" height="6" fill="#7a828e"/><rect x="356" y="335" width="34" height="6" fill="#7a828e"/><rect x="336" y="383" width="54" height="6" fill="#7a828e"/><rect x="356" y="431" width="34" height="6" fill="#7a828e"/><rect x="336" y="479" width="54" height="6" fill="#7a828e"/><rect x="356" y="527" width="34" height="6" fill="#7a828e"/><rect x="336" y="575" width="54" height="6" fill="#7a828e"/><rect x="356" y="623" width="34" height="6" fill="#7a828e"/>
<g filter="url(#raise)"><circle cx="612" cy="430" r="70" fill="#eef1f5"/></g><circle cx="612" cy="430" r="31" fill="#1f4f7c"/>
</svg>
