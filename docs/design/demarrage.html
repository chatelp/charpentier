<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charpentier · démarrage du X250</title>
    <link rel="stylesheet" href="../../packages/core/src/styles/base.css" />
    <style>
      /* Storyboard de la séquence de démarrage du X250 (DESIGN §4.12, 1.22).
         ?plan=1…12 affiche une image fixe ; ?anim joue la séquence (temps réels, accélérés
         d'un facteur ?x=, 1 par défaut, hors logo du firmware). */
      body {
        margin: 0;
        background: #8d949e;
      }
      #frame {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ch-bg);
      }
      .sys {
        --ink: #dfe3ea;
        --ink2: #b9c0ca;
        --muted: #8a929e;
        --faint: #555b66;
        --amber: #e0a040;
        --bg: #14161a;
        position: absolute;
        inset: 0;
        z-index: 5;
        background: var(--bg);
        color: var(--ink2);
        font: 13px/1.5 var(--ch-font-sys);
        font-variant-numeric: tabular-nums;
      }
      /* Le logo du firmware, gardé par Plymouth (table BGRT) : 768 × 122, à 351 px du haut. */
      .bgrt {
        position: absolute;
        left: 576px;
        top: 351px;
        width: 768px;
        height: 122px;
        display: grid;
        place-items: center;
        border: 1px dashed #3a3f48;
        color: #3a3f48;
        font-size: 12px;
        transition: opacity 400ms linear;
      }
      .mark {
        position: absolute;
        left: 0;
        right: 0;
        top: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 400ms linear;
      }
      .mark svg {
        width: 56px;
        height: 56px;
        color: var(--ink);
      }
      .mark .name {
        margin-top: 18px;
        color: var(--ink);
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      .zone {
        position: absolute;
        left: 0;
        right: 0;
        top: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 120px;
      }
      .prompt {
        color: var(--ink2);
      }
      .field {
        margin-top: 10px;
        width: 320px;
        height: 28px;
        border-bottom: 1px solid var(--ink2);
        color: var(--amber);
        text-align: center;
        font-size: 18px;
        letter-spacing: 8px;
        line-height: 28px;
      }
      .refused {
        margin-top: 18px;
        padding: 0 8px;
        background: var(--ink);
        color: var(--bg);
        line-height: 22px;
      }
      .upd {
        margin-bottom: 14px;
        color: var(--ink2);
      }
      /* La barre : quarante cellules de 6 × 10 px, 2 px d'écart (318 px), remplies en ambre,
         une cellule à la fois, sans fondu : l'instrument avance par crans. */
      .bar {
        display: flex;
        gap: 2px;
      }
      .bar i {
        width: 6px;
        height: 10px;
        background: #2c313a;
      }
      .bar i.on {
        background: var(--bar-on, var(--ink2));
      }
      .label {
        margin-top: 14px;
        color: var(--faint);
      }
      .foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 36px;
        text-align: center;
        color: var(--faint);
        font-size: 12px;
      }
      /* Le rideau : la matière du système remonte et devient la ligne de 30 px. */
      .curtain {
        transition: height 450ms cubic-bezier(0.3, 0, 0.2, 1);
        bottom: auto;
        height: 1080px;
        border-bottom: 1px solid #2c313a;
      }
      .fade {
        transition: opacity 150ms linear;
      }
      .line {
        position: absolute;
        inset: 0 0 auto;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        font-size: 11.5px;
        line-height: 30px;
        opacity: 0;
        transition: opacity 200ms linear 300ms;
      }
      .line b {
        color: var(--ink);
        font-weight: 500;
      }
      /* La page, dessous. */
      .page {
        position: absolute;
        inset: 30px 0 0;
        background: var(--ch-bg);
        color: var(--ch-ink);
      }
      .page .hd {
        display: flex;
        justify-content: space-between;
        height: 52px;
        align-items: center;
        padding: 0 24px;
        color: var(--ch-muted);
        font: 14px var(--ch-font-text);
      }
      .page .t {
        width: var(--ch-measure);
        margin: 230px auto 0;
        font: 19px/1.7 var(--ch-font-text);
      }
      .cap {
        position: absolute;
        right: 20px;
        bottom: 14px;
        z-index: 9;
        padding: 2px 8px;
        background: #f4d58d;
        color: #22262d;
        font: 12px var(--ch-font-ui);
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <script>
      const P = new URLSearchParams(location.search);
      const frame = document.getElementById('frame');
      // La barre est en encre (choix de l'auteur, 17 nov.) ; ?barre=ambre montre la variante écartée.
      if (P.get('barre') === 'encre')
        document.documentElement.style.setProperty('--bar-on', '#b9c0ca');
      const SQ = `<svg viewBox="0 0 24 24"><path d="M3 2h6v13h13v6H3z" fill="currentColor"/><circle cx="17" cy="8" r="3" fill="#e0a040"/></svg>`;
      const bar = (n) =>
        `<div class="bar">${Array.from({ length: 40 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;
      const page = `<div class="page"><div class="hd"><span>Avant Nantes ⌄</span><span style="font:13px var(--ch-font-ui)"><span style="color:var(--ch-author);margin-right:22px">Écrire</span>Atelier</span></div>
        <div class="t">Le quai de la Fosse est noir de monde. Hélène amarre le bateau entre deux gabares et cherche, parmi les hommes en casquette, celui qui a écrit la lettre.</div></div>`;

      // Une image : o = { bgrt, mark, prompt, dots, refused, upd, bar, label, foot, curtain, line, cap }
      function draw(o) {
        const zone = [
          o.upd ? `<div class="upd">${o.upd}</div>` : '',
          o.prompt
            ? `<div class="prompt">${o.prompt}</div><div class="field">${'●'.repeat(o.dots || 0)}</div>`
            : '',
          o.refused ? `<div class="refused">mot de passe refusé</div>` : '',
          o.bar !== undefined ? bar(o.bar) : '',
          o.label ? `<div class="label">${o.label}</div>` : '',
        ].join('');
        frame.innerHTML =
          (o.page ? page : '') +
          `<div class="sys ${o.curtainClass || ''}" style="${o.curtain !== undefined ? `height:${o.curtain}px` : ''}">
            ${o.bgrt ? `<div class="bgrt" style="opacity:${o.bgrt}">logo du firmware (BGRT, 768 × 122)</div>` : ''}
            ${o.mark ? `<div class="mark fade" style="opacity:${o.mark}">${SQ}<div class="name">charpentier</div></div>` : ''}
            <div class="zone fade" style="opacity:${o.zone ?? 1}">${zone}</div>
            ${o.foot ? `<div class="foot">${o.foot}</div>` : ''}
            ${o.line ? `<div class="line" style="opacity:1;transition:none">${SQ.replace('<svg', '<svg style="width:13px;height:13px;color:#dfe3ea"')}<b>charpentier</b><span>0.1.1</span></div>` : ''}
          </div>` +
          (o.cap ? `<div class="cap">${o.cap}</div>` : '');
      }

      const FOOT = 'x250 · 0.1.1';
      const PLANS = {
        1: { bgrt: 1, cap: '0 s · logo du firmware (18,8 s aujourd’hui)' },
        2: {
          bgrt: 0.35,
          mark: 0.65,
          cap: '+1,6 s · Plymouth : le logo s’efface, l’équerre vient (400 ms)',
        },
        3: {
          mark: 1,
          prompt: 'mot de passe du disque',
          dots: 0,
          foot: FOOT,
          cap: '+2,7 s · l’invite',
        },
        4: {
          mark: 1,
          prompt: 'mot de passe du disque',
          dots: 9,
          foot: FOOT,
          cap: 'frappe : un point ambre par caractère',
        },
        5: {
          mark: 1,
          prompt: 'mot de passe du disque',
          dots: 0,
          refused: true,
          foot: FOOT,
          cap: 'refusé : ligne inversée, le champ se vide',
        },
        6: {
          mark: 1,
          bar: 9,
          label: 'démarrage',
          foot: FOOT,
          cap: '⏎ : le champ cède la place à la barre (150 ms)',
        },
        7: {
          mark: 1,
          bar: 24,
          label: 'démarrage',
          foot: FOOT,
          cap: '+8,6 s · Plymouth sort à 24 cellules ; sway puis la première fenêtre d’Electron peignent cette même image',
        },
        8: {
          mark: 1,
          bar: 40,
          label: 'démarrage',
          foot: FOOT,
          cap: 'l’app termine la barre ; tenue 300 ms ; cloche si les sons d’allumage sont activés',
        },
        9: {
          page: true,
          curtain: 520,
          zone: 0,
          mark: 0,
          cap: 'le rideau remonte (450 ms) et devient la ligne système',
        },
        10: { page: true, curtain: 30, line: true, zone: 0, cap: 'la page : on écrit' },
        11: {
          mark: 1,
          upd: 'mise à jour 0.1.2',
          prompt: 'mot de passe du disque',
          dots: 0,
          foot: FOOT,
          cap: 'variante · mise à jour prête',
        },
        12: {
          mark: 1,
          bar: 14,
          label: 'mise à jour 0.1.2',
          foot: FOOT,
          cap: 'variante · mise à jour : même barre, plus longue à remplir',
        },
        13: {
          mark: 1,
          bar: 30,
          label: 'reprise',
          foot: FOOT,
          cap: 'variante · reprise après hibernation : la page revient telle quelle',
        },
        14: {
          mark: 1,
          label: 'extinction · vos textes sont enregistrés',
          foot: FOOT,
          cap: 'variante · extinction : le rideau redescend, puis noir',
        },
        15: { mark: 1, label: 'redémarrage', foot: FOOT, cap: 'variante · redémarrage' },
      };

      if (!P.has('anim')) {
        draw(PLANS[P.get('plan') || 1]);
        if (P.has('nocap')) document.querySelector('.cap')?.remove();
      } else {
        // La séquence, de bout en bout, au temps réel (logo du firmware raccourci à 2 s).
        const x = Number(P.get('x') || 1);
        const wait = (ms) => new Promise((r) => setTimeout(r, ms / x));
        (async () => {
          draw({ bgrt: 1 });
          await wait(2000);
          draw({ bgrt: 1, mark: 0 });
          await wait(30);
          draw({ bgrt: 0, mark: 1 });
          await wait(1100);
          draw({ mark: 1, prompt: 'mot de passe du disque', dots: 0, foot: FOOT });
          for (let d = 1; d <= 9; d++) {
            await wait(160);
            draw({ mark: 1, prompt: 'mot de passe du disque', dots: d, foot: FOOT });
          }
          await wait(400);
          // Plymouth : 0 → 24 cellules en 8,6 s, à la cadence estimée.
          for (let n = 0; n <= 24; n++) {
            draw({ mark: 1, bar: n, label: 'démarrage', foot: FOOT });
            await wait(8600 / 24);
          }
          // Temps mort (sway, Electron) : la même image, immobile.
          await wait(2500);
          // L'app : 24 → 40 en 2 s.
          for (let n = 25; n <= 40; n++) {
            draw({ mark: 1, bar: n, label: 'démarrage', foot: FOOT });
            await wait(2000 / 16);
          }
          await wait(300);
          draw({
            page: true,
            curtainClass: 'curtain',
            mark: 1,
            bar: 40,
            label: 'démarrage',
            foot: FOOT,
            zone: 1,
          });
          const sys = frame.querySelector('.sys');
          sys.querySelectorAll('.fade, .foot').forEach((e) => (e.style.opacity = 0));
          await wait(150);
          sys.style.height = '30px';
          sys.insertAdjacentHTML(
            'beforeend',
            `<div class="line">${SQ.replace('<svg', '<svg style="width:13px;height:13px;color:#dfe3ea"')}<b>charpentier</b><span>0.1.1</span></div>`,
          );
          requestAnimationFrame(() => (sys.querySelector('.line').style.opacity = 1));
        })();
      }
    </script>
  </body>
</html>
