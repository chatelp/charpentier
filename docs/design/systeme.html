<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charpentier · charte du système (X250)</title>
    <!-- Les tokens de l'app : polices, perle de la page, matière du système. -->
    <link rel="stylesheet" href="../../packages/core/src/styles/base.css" />
    <style>
      /* Maquette de la charte du système du X250, grammaire B « instrument plat »
         et ambre (DESIGN §3.1, §4.12, 1.21). Écrans : ?ecran=ligne|wifi|menu|journal|
         reglages|terminal|verrou|imprimer|echelle ; &sombre pour la page en sombre. */
      body {
        margin: 0;
        background: #8d949e;
      }
      #frame {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ch-bg);
        color: var(--ch-ink);
      }
      #frame.s150 {
        width: 1280px;
        height: 720px;
      }

      /* ---- La matière du système, grammaire B ---- */
      .sys {
        --ch-bg: #14161a;
        --ch-ink: #dfe3ea;
        --ch-ink-2: #b9c0ca;
        --ch-muted: #8a929e;
        --ch-faint: #555b66;
        --sys-rule: #2c313a;
        --sys-accent: #e0a040;
        background: var(--ch-bg);
        color: var(--ch-ink-2);
        font: 400 11.5px/30px var(--ch-font-sys);
        font-variant-numeric: tabular-nums;
      }
      .line {
        position: absolute;
        inset: 0 0 auto;
        z-index: 5;
        display: flex;
        height: 30px;
        white-space: nowrap;
        border-bottom: 1px solid var(--sys-rule);
      }
      .seg {
        display: flex;
        flex: none;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        border-right: 1px solid var(--sys-rule);
        color: var(--ch-muted);
      }
      .seg:last-child {
        border-right: 0;
      }
      .seg b {
        color: var(--ch-ink);
        font-weight: 500;
      }
      .seg .v {
        color: var(--ch-ink-2);
      }
      .seg .f {
        color: var(--ch-faint);
      }
      .seg.msg {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
      }
      .seg.msg span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .seg.open,
      .row.sel,
      .btn.sel {
        background: var(--ch-ink);
        color: var(--ch-bg);
      }
      .seg.open *,
      .row.sel * {
        color: var(--ch-bg) !important;
      }
      .seg.todo {
        background: var(--sys-accent);
        color: var(--ch-bg);
      }
      .seg.todo * {
        color: var(--ch-bg) !important;
      }
      .seg.todo .gauge i {
        background: rgb(20 22 26 / 0.3);
      }
      .seg.todo .gauge i.on {
        background: var(--ch-bg);
      }
      .acc {
        color: var(--sys-accent) !important;
      }
      .sq {
        width: 13px;
        height: 13px;
        flex: none;
      }
      .gauge {
        display: inline-flex;
        gap: 2px;
      }
      .gauge i {
        width: 4px;
        height: 9px;
        background: var(--ch-faint);
      }
      .gauge i.on {
        background: var(--ch-ink-2);
      }
      .bars .miss {
        color: var(--ch-faint);
      }

      /* Panneau : plat, attaché sous son segment, filets de 1 px, lignes de 24 px. */
      .panel {
        position: absolute;
        top: 30px;
        z-index: 6;
        width: 372px;
        border: 1px solid var(--sys-rule);
        border-top: 0;
        font-size: 12px;
        line-height: 24px;
      }
      .ph {
        display: flex;
        justify-content: space-between;
        padding: 3px 12px;
        border-bottom: 1px solid var(--sys-rule);
        color: var(--ch-ink);
      }
      .ph span {
        color: var(--ch-faint);
      }
      .grp {
        padding: 6px 0;
        border-bottom: 1px solid var(--sys-rule);
      }
      .grp:last-child {
        border-bottom: 0;
      }
      .gt {
        padding: 0 12px;
        color: var(--ch-faint);
      }
      .row {
        display: flex;
        align-items: center;
        height: 24px;
        padding: 0 12px;
        color: var(--ch-ink-2);
      }
      .row .ld {
        flex: 1;
        min-width: 12px;
        margin: 0 6px;
        overflow: hidden;
        color: var(--ch-faint);
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .row .val {
        color: var(--ch-ink);
      }
      .row .k {
        margin-left: 10px;
        color: var(--ch-faint);
      }
      .row .sub {
        color: var(--ch-muted);
      }
      .row.dim {
        color: var(--ch-muted);
      }
      .help {
        padding: 0 12px 4px 24px;
        color: var(--ch-muted);
        line-height: 18px;
      }
      .opt {
        color: var(--ch-muted);
      }
      .opt.on {
        color: var(--ch-ink);
      }
      .opt.on::before {
        content: '[';
        color: var(--ch-faint);
      }
      .opt.on::after {
        content: ']';
        color: var(--ch-faint);
      }
      .opt + .opt {
        margin-left: 8px;
      }
      .btn {
        display: inline-block;
        padding: 0 9px;
        border: 1px solid var(--sys-rule);
        line-height: 22px;
        color: var(--ch-ink-2);
      }
      .btn.main {
        border-color: var(--ch-ink-2);
        color: var(--ch-ink);
      }
      .btn kbd,
      .k kbd {
        margin-left: 8px;
        color: var(--ch-faint);
        font: inherit;
      }
      .foot {
        padding: 3px 12px;
        border-top: 1px solid var(--sys-rule);
        color: var(--ch-faint);
        font-size: 11px;
        line-height: 20px;
      }
      .cells {
        display: inline-flex;
        gap: 2px;
        vertical-align: middle;
      }
      .cells i {
        width: 6px;
        height: 11px;
        background: var(--ch-faint);
      }
      .cells i.on {
        background: var(--ch-ink-2);
      }

      /* ---- La page de l'app derrière (perle), juste assez pour situer ---- */
      .page {
        position: absolute;
        inset: 30px 0 0;
        background: var(--ch-bg);
      }
      .page .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 52px;
        padding: 0 24px;
        color: var(--ch-muted);
        font: 14px var(--ch-font-text);
      }
      .page .crumb {
        font: 12.5px var(--ch-font-text);
        letter-spacing: 0.12em;
        font-variant-caps: all-small-caps;
        font-size: 15px;
      }
      .page .crumb em {
        color: var(--ch-author);
        letter-spacing: 0;
        font-variant-caps: normal;
        font-size: 15px;
      }
      .page .tabs {
        font: 13px var(--ch-font-ui);
      }
      .page .tabs span:first-child {
        color: var(--ch-author);
        margin-right: 22px;
      }
      .page .open {
        margin: 92px auto 0;
        width: var(--ch-measure);
        text-align: center;
        font-family: var(--ch-font-text);
      }
      .page .open .n {
        color: var(--ch-author);
        font-size: 44px;
      }
      .page .open .c {
        margin-top: 2px;
        color: var(--ch-ink-2);
        font-size: 16px;
        letter-spacing: 0.22em;
        font-variant-caps: all-small-caps;
        font-size: 20px;
      }
      .page .open .s {
        margin-top: 34px;
        font-style: italic;
        font-size: 21px;
      }
      .page .txt {
        width: var(--ch-measure);
        margin: 48px auto 0;
        font: 19px/1.7 var(--ch-font-text);
      }
      .page .ft {
        position: absolute;
        inset: auto 22px 14px;
        display: flex;
        justify-content: space-between;
        color: var(--ch-muted);
        font: 12.5px var(--ch-font-ui);
      }

      /* ---- Écrans pleins ---- */
      .full {
        position: absolute;
        inset: 30px 0 0;
        z-index: 4;
        font-size: 12px;
        line-height: 24px;
      }
      .rail {
        position: absolute;
        inset: 0 auto 0 0;
        width: 340px;
        border-right: 1px solid var(--sys-rule);
        padding-top: 14px;
      }
      .rail .t {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 16px 12px;
        border-bottom: 1px solid var(--sys-rule);
        color: var(--ch-ink);
      }
      .rail .row {
        padding: 0 16px;
      }
      .rail .last {
        position: absolute;
        inset: auto 0 0;
        padding: 6px 0;
        border-top: 1px solid var(--sys-rule);
      }
      .sec {
        position: absolute;
        inset: 0 0 0 341px;
        padding: 22px 48px;
      }
      .sec .path {
        color: var(--ch-faint);
      }
      .sec h1 {
        margin: 2px 0 18px;
        color: var(--ch-ink);
        font: 500 20px/1.4 var(--ch-font-sys);
      }
      .sec .grp {
        max-width: 860px;
        padding: 10px 0 12px;
      }
      .sec .gt {
        padding: 0 0 4px;
      }
      .sec .row,
      .sec .help {
        padding-left: 0;
        padding-right: 0;
      }
      .sec .help {
        margin-left: 0;
        max-width: 640px;
      }
      .tbl {
        display: grid;
        grid-template-columns: 280px 160px 160px;
        max-width: 860px;
      }
      .tbl div {
        height: 24px;
        padding-left: 6px;
        color: var(--ch-ink-2);
      }
      .tbl .th {
        color: var(--ch-faint);
      }
      .tbl .sel {
        background: var(--ch-ink);
        color: var(--ch-bg);
        padding-left: 6px;
      }
      .xclose {
        position: absolute;
        top: 16px;
        right: 22px;
        color: var(--ch-faint);
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <script>
      const P = new URLSearchParams(location.search);
      const ecran = P.get('ecran') || 'ligne';
      const frame = document.getElementById('frame');
      if (P.has('sombre')) document.documentElement.dataset.theme = 'dark';
      const s150 = ecran === 'echelle';
      if (s150) frame.classList.add('s150');

      // L'équerre, son point en ambre : la marque de la machine.
      const SQ = `<svg class="sq" viewBox="0 0 24 24"><path d="M3 2h6v13h13v6H3z" fill="currentColor"/><circle cx="17" cy="8" r="3" fill="#e0a040"/></svg>`;
      const lead = () => `<span class="ld">${'·'.repeat(160)}</span>`;
      const gauge = (n, of = 10) =>
        `<span class="gauge">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
      const cells = (n, of = 20) =>
        `<span class="cells">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
      const bars = (n) =>
        `<span class="bars">${'▂▄▆█'
          .split('')
          .map((c, i) => (i < n ? c : `<span class="miss">${c}</span>`))
          .join('')}</span>`;
      const row = (label, val = '', opts = {}) =>
        `<div class="row ${opts.cls || ''}"><span>${label}</span>${lead()}<span class="val">${val}</span>${opts.k ? `<span class="k">${opts.k}</span>` : ''}</div>`;
      const opt = (list, on) =>
        list.map((o) => `<span class="opt ${o === on ? 'on' : ''}">${o}</span>`).join('');

      // ---- La ligne ----
      function line(o = {}) {
        const open = o.open || '';
        const seg = (id, html, cls = '') =>
          `<div class="seg ${cls} ${open === id ? 'open' : ''}">${html}</div>`;
        const narrow = s150;
        const parts = [
          seg('sys', `${SQ}<b>charpentier</b>${narrow ? '' : '<span class="v">0.1.1</span>'}`),
          seg('msg', `<span class="${o.msgCls || ''}">${o.msg || ''}</span>`, `msg`),
        ];
        if (o.maj) parts.push(seg('maj', `maj <span class="v acc">0.1.2</span>`));
        if (!narrow)
          parts.push(
            seg('cpu', `cpu <span class="v">▁▂▁▃▂▁▁▂▅▃▂▁</span> <span class="v">12 % 48°</span>`),
          );
        parts.push(
          seg(
            'net',
            narrow
              ? `<span class="v">maison ${bars(3)}</span>`
              : `wifi <span class="v">maison</span> <span class="v">${bars(3)}</span>`,
          ),
        );
        if (!narrow) parts.push(seg('bt', `bt <span class="v">1</span>`));
        if (!narrow) parts.push(seg('lum', `lum ${gauge(7)} <span class="v">70</span>`));
        if (!narrow) parts.push(seg('vol', `vol ${gauge(4)} <span class="v">40</span>`));
        parts.push(
          seg(
            'bat',
            narrow
              ? `<span class="v">${o.bat || '82 %'}</span>`
              : `bat ${gauge(o.batLow ? 1 : 8)} <span class="v">${o.bat || '82 %'}</span> <span class="f">${o.batLow ? '0h25' : '5h40'}</span>`,
            o.batLow ? 'todo' : '',
          ),
        );
        parts.push(
          seg('sync', narrow ? `<span class="v">ok</span>` : `sync <span class="v">ok</span>`),
        );
        parts.push(
          seg(
            'date',
            narrow
              ? `<span class="v">14:32</span>`
              : `<span class="f">ven. 13</span> <span class="v">14:32</span>`,
          ),
        );
        return `<div class="sys line">${parts.join('')}</div>`;
      }

      function page() {
        return `<div class="page"><div class="hd"><span>Avant Nantes <span style="color:var(--ch-faint)">⌄</span></span>
          <span class="crumb">III · Le fleuve — <em>4 · Le quai de la Fosse</em></span>
          <span class="tabs"><span>Écrire</span><span>Atelier</span></span></div>
          <div class="open"><div class="n">III</div><div class="c">Le fleuve</div><div class="s">Le quai de la Fosse</div></div>
          <div class="txt">Le quai de la Fosse est noir de monde. Hélène amarre le bateau entre deux gabares et cherche, parmi les hommes en casquette, celui qui a écrit la lettre. Elle le reconnaît à sa façon de ne regarder personne.</div>
          <div class="ft"><span>1 480 mots · <span style="color:var(--ch-author)">+212 aujourd’hui</span></span><span>Enregistré</span></div></div>`;
      }

      // Aligne un panneau sous son segment.
      function under(id, html, dx = 0) {
        requestAnimationFrame(() => {
          const segs = [...document.querySelectorAll('.seg')];
          const s = segs.find((e) => e.classList.contains('open'));
          const p = document.querySelector('.panel');
          if (!s || !p) return;
          let left = s.offsetLeft + dx;
          left = Math.min(left, frame.clientWidth - p.offsetWidth - 8);
          p.style.left = left + 'px';
        });
        return html;
      }

      const screens = {
        ligne: () =>
          page() +
          line({ msg: 'clé branchée · <span class="acc">⊞U copier mes textes</span>', msgCls: '' }),
        wifi: () =>
          page() +
          line({ open: 'net', msg: '<span class="f">journal</span>' }) +
          under(
            'net',
            `<div class="sys panel">
            <div class="ph">réseau<span>⊞W</span></div>
            <div class="grp">${row('wi-fi', opt(['oui', 'non'], 'oui'))}${row('câble', '<span class="sub">non branché</span>')}</div>
            <div class="grp"><div class="gt">réseaux visibles</div>
              <div class="row sel"><span>maison</span>${lead()}<span>${bars(3)} connecté</span></div>
              ${row('Livebox-7A2C', bars(2) + ' <span class="sub">protégé</span>')}
              ${row('iPhone de Pierre', bars(4) + ' <span class="sub">tél</span>')}
              ${row('Gare-Wifi', bars(1) + ' <span class="sub">portail</span>')}
            </div>
            <div class="grp" style="padding:8px 12px">
              <span class="btn main">se connecter<kbd>⏎</kbd></span> <span class="btn">oublier<kbd>⌫</kbd></span></div>
            <div class="foot">adresse 192.168.1.24 · ↑↓ choisir · échap fermer</div>
          </div>`,
          ),
        menu: () =>
          page() +
          line({ open: 'sys', msg: '' }) +
          under(
            'sys',
            `<div class="sys panel" style="width:420px">
            <div class="ph">charpentier 0.1.1<span>nixos 26.11 · x250</span></div>
            <div class="grp">${row('réglages du système', '', { k: '⊞,' })}${row('réglages de l’app', '', { k: '⌘,' })}${row('terminal', '', { k: '⊞T' })}</div>
            <div class="grp">${row('imprimer…', '', { k: '⊞P' })}${row('copier mes textes sur une clé', '', { k: '⊞U' })}${row('verrouiller', '', { k: '⊞L' })}</div>
            <div class="grp">
              <div class="row sel"><span>mettre en veille</span>${lead()}<span class="k">⊞⏎</span></div>
              <div class="help">instantané · l’écran revient d’une touche, tel quel</div>
              ${row('hiberner…')}
              <div class="help">éteint vraiment · tout est gardé, reprise après le mot de passe du disque</div>
            </div>
            <div class="grp">${row('redémarrer…')}${row('éteindre…')}</div>
            <div class="foot">allumé depuis 3 h 12 · ↑↓ choisir · ⏎ ouvrir · échap fermer</div>
          </div>`,
          ),
        journal: () =>
          page() +
          line({
            open: 'msg',
            msg: '<span class="acc">impression impossible · imprimante éteinte</span>',
            maj: true,
          }) +
          under(
            'msg',
            `<div class="sys panel" style="width:520px">
            <div class="ph">journal<span>⊞J</span></div>
            <div class="grp"><div class="gt">à faire · 2</div>
              <div class="row sel"><span>14:31  impression impossible · imprimante éteinte</span>${lead()}<span>réessayer ⏎</span></div>
              <div class="row"><span class="acc">14:05</span>&nbsp;&nbsp;mise à jour prête · 0.1.2${lead()}<span class="k">⊞R</span></div>
            </div>
            <div class="grp"><div class="gt">fait</div>
              ${row('<span class="sub">14:20</span>&nbsp;&nbsp;textes copiés · clé KINGSTON', '')}
              ${row('<span class="sub">13:52</span>&nbsp;&nbsp;réseau instable · 4 fois en 10 min', '')}
              ${row('<span class="sub">11:40</span>&nbsp;&nbsp;wifi oui · maison', '')}
            </div>
            <div class="foot">effacé à l’extinction · le reste est dans journalctl · échap fermer</div>
          </div>`,
          ),
        reglages: () =>
          line({ msg: '' }) +
          `<div class="sys full">
          <div class="rail">
            <div class="t">${SQ}réglages du système</div>
            <div style="padding-top:8px">
            ${row('réseau', 'maison')}${row('bluetooth', '1')}${row('écran', '100 %')}${row('son', '40')}${row('clavier', 'azerty')}
            <div class="row sel"><span>énergie</span>${lead()}<span>82 %</span></div>
            ${row('verrouillage', 'au réveil')}${row('impression', 'brother')}${row('clé usb', '—')}${row('date et heure', 'paris')}${row('terminal', 'visible')}${row('à propos', '0.1.1')}
            </div>
            <div class="last">${row('réglages de l’app', '', { k: '⌘,' })}</div>
          </div>
          <div class="sec">
            <div class="xclose">échap ×</div>
            <div class="path">réglages du système /</div>
            <h1>énergie</h1>
            <div class="grp"><div class="gt">batteries</div>
              ${row('bat0 · interne', '74 % · usure 12 %')}${row('bat1 · arrière', '90 % · usure 21 %')}${row('ensemble', '82 % · 5h40 · 6,1 W')}
            </div>
            <div class="grp"><div class="gt">inactivité</div>
              <div class="tbl">
                <div class="th"></div><div class="th">sur batterie</div><div class="th">sur secteur</div>
                <div>atténuer l’écran</div><div class="sel">1 min</div><div>5 min</div>
                <div>éteindre l’écran</div><div>3 min</div><div>10 min</div>
                <div>mettre en veille</div><div>10 min</div><div>30 min</div>
              </div>
              <div class="help">atténuer : 30 % de la luminosité, une touche la rétablit. jamais de veille pendant une synchronisation, une impression, une copie sur clé ou un téléchargement.</div>
            </div>
            <div class="grp"><div class="gt">économie d’énergie</div>
              ${row('activer', opt(['sur batterie', 'toujours', 'jamais'], 'sur batterie'))}
              <div class="help">pas de turbo, luminosité baissée de 20 %. se déclenche aussi seule sous 20 %.</div>
            </div>
            <div class="grp"><div class="gt">préserver les batteries</div>
              ${row('arrêter la charge à 80 %', opt(['oui', 'non'], 'oui'))}
              ${row('cette fois seulement', '<span class="btn">charger à 100 %</span>')}
              <div class="help">la charge reprend sous 75 %. pour un long trajet, une pleine charge, puis le seuil revient.</div>
            </div>
            <div class="grp"><div class="gt">veille et hibernation</div>
              ${row('rabat fermé', opt(['veille', 'rien'], 'veille'))}
              ${row('en veille sur batterie, hiberner après', opt(['1 h', '3 h', '12 h', 'jamais'], '3 h'))}
              ${row('batterie à 3 %', 'hiberner')}
              <div class="help">veille : instantanée, la mémoire reste alimentée. hibernation : tout est écrit sur le disque chiffré et l’appareil s’éteint ; il reprend après le mot de passe du disque.</div>
            </div>
            <div class="foot" style="border:0;padding:12px 0 0">↑↓ choisir · ←→ changer · ⏎ ouvrir · échap revenir au texte</div>
          </div></div>`,
        terminal: () =>
          page() +
          line({ msg: '<span class="f">journal</span>' }) +
          `<div class="sys" style="position:absolute;inset:30px 0 auto;height:${P.has('poignee') ? 640 : 432}px;z-index:4;border-bottom:1px solid ${P.has('poignee') ? 'var(--ch-ink-2)' : 'var(--sys-rule)'};font-size:13px;line-height:20px">

            <div style="display:flex;justify-content:space-between;padding:4px 14px;border-bottom:1px solid var(--sys-rule);font-size:12px;line-height:22px">

            <pre style="margin:0;padding:10px 14px;font:inherit;color:var(--ch-ink-2)"><span style="color:var(--ch-muted)">~ $</span> systemctl status charpentier-sync

<span style="color:var(--ch-muted)">~ $</span> <span style="background:#e0a040;color:#14161a">&nbsp;</span></pre></div>`,
        verrou: () =>
          `<div class="sys line"><div class="seg">${SQ}<b>charpentier</b><span class="v">0.1.1</span></div><div class="seg msg"><span>verrouillé</span></div><div class="seg">bat ${gauge(8)} <span class="v">82 %</span></div><div class="seg"><span class="v">14:32</span></div></div>
          <div class="sys full" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:80px">
            <div style="color:var(--ch-ink);font:300 64px/1 var(--ch-font-sys)">14:32</div>
            <div style="margin-top:12px;color:var(--ch-muted);font-size:13px">vendredi 13 novembre</div>
            <div style="margin-top:56px;color:var(--ch-ink-2);font-size:13px">votre code, puis ⏎</div>
            <div style="margin-top:10px;width:280px;height:30px;border-bottom:1px solid var(--ch-ink-2);text-align:center;color:var(--sys-accent);font-size:20px;letter-spacing:8px;line-height:30px">●●●●</div>
            <div style="margin-top:24px;padding:0 8px;background:var(--ch-ink);color:var(--ch-bg);font-size:13px;line-height:22px;visibility:${P.has('refus') ? 'visible' : 'hidden'}">code refusé</div>
          </div>`,
        imprimer: () =>
          page() +
          line({ msg: '' }) +
          `<div style="position:absolute;inset:30px 0 0;z-index:3;background:rgb(20 22 26 / .55)"></div>
          <div class="sys" style="position:absolute;z-index:4;left:50%;top:150px;transform:translateX(-50%);display:flex;border:1px solid var(--sys-rule);font-size:12px;line-height:24px">

              <div class="ph" style="display:flex;gap:9px;justify-content:flex-start;align-items:center">${SQ}imprimer<span style="margin-left:auto">⊞P</span></div>
              <div class="grp"><div class="gt">quoi</div>
                <div class="row sel"><span>cette scène</span>${lead()}<span>III.4 · 2 pages</span></div>

              <div class="grp"><div class="help" style="padding-left:12px">mise en page de manuscrit : literata 12 pt, interligne double, marges de 2,5 cm, titre courant et folio.</div></div>
              <div class="grp" style="margin-top:auto;padding:10px 12px;border-top:1px solid var(--sys-rule)"><span class="btn main">imprimer<kbd>⏎</kbd></span> <span class="btn">annuler<kbd>échap</kbd></span></div>
            </div>
            <div style="width:340px;padding:22px 40px;background:#d9dde3;border-left:1px solid var(--sys-rule)">
              <div style="height:368px;padding:28px 26px;background:#fbfbf8;box-shadow:0 1px 3px rgb(0 0 0 / .3);color:#22262d;font:7.4px/2 var(--ch-font-text)">
                <div style="display:flex;justify-content:space-between;color:#6a717c;font-size:6.5px;margin-bottom:20px"><span>Avant Nantes</span><span>III</span></div>
                <div style="text-align:center;font-size:10px;font-style:italic;margin-bottom:16px">Le quai de la Fosse</div>
                Le quai de la Fosse est noir de monde. Hélène amarre le bateau entre deux gabares et cherche, parmi les hommes en casquette, celui qui a écrit la lettre. Elle le reconnaît à sa façon de ne regarder personne. Il porte un paquet sous le bras, ficelé comme on ficelle les choses qu’on ne veut pas ouvrir. Elle descend la passerelle, et le fleuve, derrière elle, continue de monter.
                <div style="position:absolute;margin-top:70px;width:208px;text-align:center;color:#6a717c;font-size:6.5px">1</div>
              </div>
            </div>
          </div>`,
        echelle: () =>
          page() +
          line({ msg: 'clé branchée · <span class="acc">⊞U copier</span>', batLow: false }),
        batterie: () =>
          page() +
          line({
            msg: '<span class="acc">batterie faible · branchez l’appareil</span>',
            batLow: true,
            bat: '9 %',
          }),
      };
      frame.innerHTML = (screens[ecran] || screens.ligne)();
