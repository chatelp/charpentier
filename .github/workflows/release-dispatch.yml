# A release vX.Y.Z of the app is a version for the X250 (docs/SPEC.md D-31,
# docs/PLAN.md phase 5.11): it tells chatelp/charpentier-os, whose workflow
# points the system at this tag, builds and tries it, and publishes it.
# Commits of main between two releases never reach the X250.
#
# Secret CHARPENTIER_OS_DISPATCH: a fine-grained token made by the author,
# for chatelp/charpentier-os only, with « Contents: Read and write ».
name: Release to the X250

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - name: Tell charpentier-os
        env:
          GH_TOKEN: ${{ secrets.CHARPENTIER_OS_DISPATCH }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          jq -n --arg tag "$TAG" --arg notes "$NOTES" \
            '{event_type: "app-release", client_payload: {tag: $tag, version: ($tag | ltrimstr("v")), notes: $notes}}' |
            gh api repos/chatelp/charpentier-os/dispatches --input -
