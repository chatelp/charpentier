name: CI

on:
  push:
    branches: [main]
    # A push that only touches the documents has nothing to check.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Headless Chromium for the browser test projects (editor, IndexedDB).
      - run: pnpm --filter @charpentier/core exec playwright install --with-deps chromium
      # Format, lint (incl. host-API guardrails), typecheck, tests,
      # guardrail self-test and dependency license check.
      - run: pnpm check
      # The desktop app itself: built, launched in Electron (virtual display), killed mid-write.
      # The display is as wide as a desk's: on xvfb's default (1280 px) the window is narrower
      # than the app's own 1440 px and the footer no longer has room for « Synchronisé ».
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" pnpm test:desktop
      # The web app itself: built, in a real Chromium, through a real server (Postgres in
      # memory) behind a network the test cuts (D-46 rule 11, PLAN 4.7 a and 7.6).
      - run: pnpm test:web

  # The app's Nix package, as the X250's system takes it (charpentier-os, D-29):
  # a dependency added without its new pnpmDeps hash (nix/charpentier.nix)
  # breaks it, and the Mac has no Nix to see it. The error gives the new hash.
  nix-package:
    name: paquet Nix de l'app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix build --print-build-logs .#charpentier
      - run: test "$(cat result/share/charpentier/data-format)" = 1
