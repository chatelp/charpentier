# Packaging of the desktop app (phase 2.5): an unsigned macOS .app.
# Main, preload and renderer are fully bundled in out/: no node_modules shipped.
appId: app.charpentier.desktop
productName: Charpentier
copyright: Copyright © 2026 Pierre Chatel
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/dictionaries
    to: dictionaries
npmRebuild: false
nodeGypRebuild: false
mac:
  category: public.app-category.productivity
  # The Équerre (docs/design/icon), built by scripts/make-icon.sh.
  icon: resources/icon.icns
  target:
    - target: dir
      arch: [arm64]
  # No Developer ID yet: ad-hoc signature only (D-14). Without notarization the
  # hardened runtime brings nothing, and its library validation would refuse
  # Electron's frameworks under an ad-hoc signature.
  identity: '-'
  hardenedRuntime: false
  darkModeSupport: true
# The X250's build (docs/PLAN.md phase 5.8): Linux x64, the same bundle and
# dictionaries; the Nix package wraps it (nix/).
linux:
  executableName: charpentier
  category: Office
  icon: resources/icon.png
  synopsis: Écrire un roman avec un mentor
  artifactName: charpentier-${version}-linux-${arch}.${ext}
  target:
    - target: tar.gz
      arch: [x64]
